      description: >-
        Actualiza los metadatos de una Parada SPIDI existente.


        Permite modificar:

        - **stop_title**: Título visible de la parada

        - **status**: Estado de la parada (`active` o `disabled`)

        - **empty_state_message**: Mensaje mostrado cuando no hay solicitudes de
        pago activas


        Los campos `stop_id`, `stop_url` e `internal_reference` no pueden
        modificarse una vez creada la parada.


        > **Hoy esta operación no responde en pruebas.** Está declarada en el
        contrato, pero todavía no está activa: si la llamas no vas a recibir
        nada, y el problema no es tuyo. Lo que puedes hacer mientras tanto está
        en [Estado de la plataforma](/recursos/estado-de-la-plataforma).
