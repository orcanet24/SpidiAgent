          type: boolean
          nullable: true
          default: false
          description: >-
            Indica si el procesamiento debe continuar con el resto de los ítems
            aunque alguno falle en operaciones de batch.

            - Si es `false`, se detiene en el primer error y las operaciones ya
            exitosas permanecen válidas. 

            - Si es `true`, continúa procesando hasta el final y luego reporta
            las fallas acumuladas.
          example: true
        items:
          type: array
          minItems: 1
          items:
            type: object
            required:
