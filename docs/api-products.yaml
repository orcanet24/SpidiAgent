  /api/v1/payment-session/{session_id}/expiration:
    post:
      summary: Expirar una Solicitud de Pago
      description: >-
        Fuerza el cierre de una sesión de pago que se encuentra en estado
        pendiente. 


        ### Comportamiento según Estado Actual


        - Si la sesión está **`PENDING`**, pasa a **`EXPIRED`** inmediatamente.

        - Si ya estaba **`EXPIRED`** no hace nada.

        - Si la sesión está **`PAID`**, **NO** puede expirarse (regla de negocio
        - retorna error 422).


        ## Efecto sobre Paradas SPIDI


        Si la sesión estaba asociada como activa en una Parada SPIDI, al pasar a
        **`expired`** deja de estar activa y queda en el histórico de la parada,
        por lo que el usuario podrá ver el mensaje que se le deja en
        `user_message`.


        ## Notas y Buenas Prácticas


        ### Paradas SPIDI


        No necesitas llamar a `/payment-stops/payment-sessions/batch` con un
        item con op = remove; al expirar, la sesión **sale sola** del conjunto
        activo de cualquier parada a la que esté asociada (queda en histórico).


        ### Trazabilidad

         Usa `message_audit` para auditoría (quién, cuándo, por qué).
      operationId: expirePaymentSession
      tags:
        - Endpoints Solicitud
      security:
        - bearerAuth: []
      parameters:
        - name: session_id
          in: path
          description: UUID único de la sesión de pago a invalidar.
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - category
              properties:
                category:
                  type: string
                  enum:
                    - INCORRECT_DATA
                    - ALTERNATIVE_PAYMENT_RECEIVED
                    - OTHER
                  description: >-
                    **Clasificación técnica obligatoria.** Permite segmentar el
                    motivo de cancelación para análisis de conversión y
                    auditoría. 


                    **Definiciones:**

                    * `INCORRECT_DATA`: Datos de pago o cliente inválidos (ej.
                    CI/RIF erróneo).

                    * `ALTERNATIVE_PAYMENT_RECEIVED`: El cliente pagó por otra
                    vía (ej. efectivo o transferencia directa).

                    * `OTHER`: Motivos no clasificados previamente (requiere
                    nota adicional).
                  example: INCORRECT_DATA
                message_audit:
                  type: string
                  nullable: true
                  description: >-
                    Nota de auditoría interna. Espacio para justificaciones
                    técnicas o administrativas. Este contenido no es visible
                    para el cliente final y se utiliza exclusivamente para
                    trazabilidad recomienda usarlo con esta estructura: (quién,
                    cuándo, por qué).
                  example: >-
                    La orden se habia generado de forma automatizada pero el
                    usuario liquido la la sesión en nuestra sucursal por medio
                    de pagos en efectivo.
                message_user:
                  type: string
                  nullable: true
                  description: >-
                    Mensaje para el usuario final cuado por ejemplo el
                    administrador necesita dar una instrucción específica.
                  example: Sesión cancelada por pago en efectivo
      responses:
        '200':
          description: >-
            Operación exitosa. Si la sesión ya estaba en un estado final
            EXPIRED, se devuelve el registro original sin aplicar cambios.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Session status expired.
                  data:
                    type: object
                    properties:
                      session_id:
                        type: string
                        format: uuid
                      status:
                        type: string
                        example: expired
                      category:
                        type: string
                        enum:
                          - INCORRECT_DATA
                          - ALTERNATIVE_PAYMENT_RECEIVED
                          - OTHER
                        description: >-
                          **Clasificación técnica obligatoria.** Permite
                          segmentar el motivo de cancelación para análisis de
                          conversión y auditoría. 


                          **Definiciones:**

                          * `INCORRECT_DATA`: Datos de pago o cliente inválidos
                          (ej. CI/RIF erróneo).

                          * `ALTERNATIVE_PAYMENT_RECEIVED`: El cliente pagó por
                          otra vía (ej. efectivo o transferencia directa).

                          * `OTHER`: Motivos no clasificados previamente
                          (requiere nota adicional).
                        example: INCORRECT_DATA
                      message_user:
                        type: string
                        nullable: true
                        description: >-
                          Mensaje para el usuario final cuado por ejemplo el
                          administrador necesita dar una instrucción específica.
                        example: Sesión cancelada por pago en efectivo
                      message_audit:
                        type: string
                        nullable: true
                        description: >-
                          Nota de auditoría interna. Espacio para
                          justificaciones técnicas o administrativas. Este
                          contenido no es visible para el cliente final y se
                          utiliza exclusivamente para trazabilidad recomienda
                          usarlo con esta estructura: (quién, cuándo, por qué).
                        example: >-
                          La orden se habia generado de forma automatizada pero
                          el usuario liquido la la sesión en nuestra sucursal
                          por medio de pagos en efectivo.
                      processed_at:
                        type: string
                        format: date-time
                        description: Fecha y hora de procesamiento en formato ISO 8601.
                        example: '2026-05-06T17:15:00-04:00'
              example:
                success: true
                message: Session status expired.
                data:
                  session_id: 3ddc4cfb-c09a-43de-92c1-e4a069732e90
                  status: expired
                  category: ALTERNATIVE_PAYMENT_RECEIVED
                  message_user: >-
                    El pago fue expirado forzosamente por que el usuario pago
                    por otro medio.
                  processed_at: '2026-05-06T17:15:00Z'
        '422':
          description: >-
            Entidad no procesable. Regla de integridad financiera: no se puede
            expirar una sesión con estado 'paid'.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: 'Business Rule Violation: Paid sessions cannot be modified.'
                  errors:
                    type: object
                    additionalProperties:
                      type: string
              example:
                success: false
                message: 'Business Rule Violation: Paid sessions cannot be modified.'
                errors:
                  status: paid
  /api/v1/ext/split-receiving-agreements:
    post:
      summary: Crear Acuerdo de Recepción de Split
      description: >-
        Crea un *agreement* de **recepción de split** —un destinatario final que
        puede recibir montos distribuidos desde otros usuarios que apliquen un
        split en sus acuerdos de pago.


        Al crear este recurso, SPIDI genera un identificador único global
        (`split_recipient_agreement_id`) con prefijo semántico `rcv_`, que debes
        compartir con los usuarios que deseen enviar parte de sus pagos hacia tu
        cuenta.


        Este *agreement* no admite splits adicionales: su única función es
        definir el **ruteo de la liquidación**, determinando la cuenta bancaria
        destino.


        ## Características


        - Identificador **global** retornado como `split_recipient_agreement_id`
        (UUID SPIDI)

        - Enrutamiento con **fallback** a `default_bank_account_id`

        - Referenciable desde acuerdos de **distribución** vía
        `split_recipient_agreement_id`


        ## Notas de Validación


        - Debe existir **siempre** `default_bank_account_id`

        - En `rules`, cada `origin_bank_code` **no puede repetirse**

        - Si en runtime no hay match de `origin_bank_code`, se utiliza el
        `default_bank_account_id`

        - Si no hay match **y** falta `default_bank_account_id` error


        ## Idempotencia


        Usa siempre `Idempotency-Key` (UUID v4). Reenviar el mismo POST con
        igual payload devolverá el mismo resultado sin duplicar efectos.
      operationId: createSplitReceivingAgreement
      tags:
        - Endpoints Especiales
      security:
        - bearerAuth: []
      parameters: []
      requestBody:
        description: Datos del acuerdo de recepción de split
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - title
                - default_bank_account_id
              properties:
                title:
                  type: string
                  nullable: false
                  description: Título visible.
                description:
                  type: string
                  nullable: true
                  description: >-
                    Descripción del acuerdo o del concepto de pago asociado a
                    una sesión.
                  maxLength: 500
                split_recipient_agreement_id:
                  type: string
                  nullable: false
                  format: uuid
                  description: >-
                    UUID global SPIDI del agreement de recepción. Este ID se
                    usará en acuerdos de distribución para identificar al
                    receptor del split. (Requerido en distribution)
                default_bank_account_id:
                  type: string
                  format: uuid
                  nullable: false
                  description: >-
                    UUID de la cuenta bancaria por defecto que se utilizará para
                    la liquidación.
                rules:
                  type: array
                  nullable: true
                  description: |-
                    (**En Desarrollo**) Reglas de acuerdo. 
                     En caso de usar origin_bank_code y destination_bank_account_id, se aplicará una regla de ruteo por banco de origen. Cada regla define a qué cuenta bancaria se debe enviar el dinero según el banco del pagador.
                  items:
                    type: object
                    properties:
                      origin_bank_code:
                        type: string
                        nullable: false
                        description: Código oficial del banco de origen.
                      destination_bank_account_id:
                        type: string
                        nullable: true
                        description: >-
                          UUID de la cuenta bancaria de destino para un banco de
                          origen específico.
            examples:
              withRules:
                summary: Con reglas de ruteo
                value:
                  title: Partner 1 (recepción)
                  description: Recibir de marketplace X
                  default_bank_account_id: uuid_sofitasa_001
                  rules:
                    - origin_bank_code: '0105'
                      destination_bank_account_id: uuid_mercantil_007
                    - origin_bank_code: '0108'
                      destination_bank_account_id: uuid_provincial_001
              withoutRules:
                summary: Sin reglas de ruteo
                value:
                  title: Partner 2 (recepción simple)
                  description: Recibir pagos de distribuidores
                  default_bank_account_id: uuid_banesco_003
      responses:
        '200':
          description: Acuerdo de recepción creado exitosamente
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - data
                properties:
                  success:
                    type: boolean
                    nullable: false
                    description: >-
                      Indica si la operación fue exitosa. True si el endpoint se
                      procesó de forma exitosa. False de lo contrario
                    example: true
                  data:
                    type: object
                    required:
                      - split_recipient_agreement_id
                      - title
                      - default_bank_account_id
                      - created_at
                      - created_by
                    properties:
                      split_recipient_agreement_id:
                        type: string
                        nullable: false
                        format: uuid
                        description: >-
                          UUID global SPIDI del agreement de recepción. Este ID
                          se usará en acuerdos de distribución para identificar
                          al receptor del split. (Requerido en distribution)
                      title:
                        type: string
                        nullable: false
                        description: Título visible.
                      description:
                        type: string
                        nullable: true
                        description: >-
                          Descripción del acuerdo o del concepto de pago
                          asociado a una sesión.
                        maxLength: 500
                      default_bank_account_id:
                        type: string
                        format: uuid
                        nullable: false
                        description: >-
                          UUID de la cuenta bancaria por defecto que se
                          utilizará para la liquidación.
                      rules:
                        type: array
                        nullable: true
                        description: |-
                          (**En Desarrollo**) Reglas de acuerdo. 
                           En caso de usar origin_bank_code y destination_bank_account_id, se aplicará una regla de ruteo por banco de origen. Cada regla define a qué cuenta bancaria se debe enviar el dinero según el banco del pagador.
                        items:
                          type: object
                          properties:
                            origin_bank_code:
                              type: string
                              nullable: false
                              description: Código oficial del banco de origen.
                            destination_bank_account_id:
                              type: string
                              nullable: true
                              description: >-
                                UUID de la cuenta bancaria de destino para un
                                banco de origen específico.
                      created_at:
                        type: string
                        nullable: true
                        format: date-time
                        description: >-
                          Fecha y hora de creación del recurso en formato ISO
                          8601.
                      created_by:
                        type: string
                        nullable: true
                        description: >-
                          Identificador del usuario que creó el recurso
                          administrable.
              example:
                success: true
                data:
                  split_recipient_agreement_id: rcv_01c3f7a2-4eaa-4a11-9d1d-3d3a6723c1a2
                  title: To receive from Partners
                  description: Recibir de marketplace X
                  default_bank_account_id: uuid_sofitasa_001
                  rules:
                    - origin_bank_code: '0105'
                      destination_bank_account_id: uuid_mercantil_007
                    - origin_bank_code: '0108'
                      destination_bank_account_id: uuid_provincial_001
                  created_at: '2025-10-20T14:30:00Z'
                  created_by: user_456
        '400':
          description: Solicitud inválida - Campo faltante o inválido
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - message
                properties:
                  success:
                    type: boolean
                    example: false
                    description: Indica que la operación falló.
                  message:
                    type: string
                    example: Invalid request parameters
                    description: Mensaje de error general.
                  errors:
                    type: object
                    nullable: true
                    description: Detalles específicos de los errores de validación.
                    properties:
                      title:
                        type: string
                        example: Title is required.
                        description: Error relacionado con el campo title.
                      default_bank_account_id:
                        type: string
                        example: Default bank account ID is required.
                        description: >-
                          Error relacionado con el campo
                          default_bank_account_id.
                      rules:
                        type: string
                        example: Duplicate origin_bank_code '0105' in rules.
                        description: Error relacionado con las reglas de ruteo.
                      origin_bank_code:
                        type: string
                        example: INVALID_BANK_CODE
                        description: Código de banco inválido.
                      destination_bank_account_id:
                        type: string
                        example: BANK_ACCOUNT_NOT_FOUND
                        description: Cuenta bancaria de destino no encontrada.
                      authorization:
                        type: string
                        example: Invalid or missing Bearer token
                        description: Error de autorización.
              example:
                success: false
                message: Invalid request parameters
                errors:
                  title: Title is required
                  default_bank_account_id: Default destination is required
        '401':
          description: No autorizado - Credenciales incorrectas
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - message
                properties:
                  success:
                    type: boolean
                    example: false
                    description: Indica que la operación falló.
                  message:
                    type: string
                    example: Invalid request parameters
                    description: Mensaje de error general.
                  errors:
                    type: object
                    nullable: true
                    description: Detalles específicos de los errores de validación.
                    properties:
                      title:
                        type: string
                        example: Title is required.
                        description: Error relacionado con el campo title.
                      default_bank_account_id:
                        type: string
                        example: Default bank account ID is required.
                        description: >-
                          Error relacionado con el campo
                          default_bank_account_id.
                      rules:
                        type: string
                        example: Duplicate origin_bank_code '0105' in rules.
                        description: Error relacionado con las reglas de ruteo.
                      origin_bank_code:
                        type: string
                        example: INVALID_BANK_CODE
                        description: Código de banco inválido.
                      destination_bank_account_id:
                        type: string
                        example: BANK_ACCOUNT_NOT_FOUND
                        description: Cuenta bancaria de destino no encontrada.
                      authorization:
                        type: string
                        example: Invalid or missing Bearer token
                        description: Error de autorización.
              example:
                success: false
                message: Unauthorized access
                errors:
                  authorization: Invalid or missing Bearer token
        '409':
          description: Conflicto - Acuerdo duplicado
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - message
                properties:
                  success:
                    type: boolean
                    example: false
                    description: Indica que la operación falló.
                  message:
                    type: string
                    example: Invalid request parameters
                    description: Mensaje de error general.
                  errors:
                    type: object
                    nullable: true
                    description: Detalles específicos de los errores de validación.
                    properties:
                      title:
                        type: string
                        example: Title is required.
                        description: Error relacionado con el campo title.
                      default_bank_account_id:
                        type: string
                        example: Default bank account ID is required.
                        description: >-
                          Error relacionado con el campo
