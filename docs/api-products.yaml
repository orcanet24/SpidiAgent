                type: string
                nullable: true
                enum:
                  - keep_active
                  - expire
                description: >-
                  Comportamiento configurado para cuando la sesión alcance su
                  fecha de vencimiento.
              late_notice_message:
                type: string
                nullable: true
                description: >-
                  Mensaje que verá el pagador cuando la sesión haya vencido pero
                  continúe activa (keep_active).
              internal_reference:
                type: string
                nullable: false
                description: >-
                  Referencia interna única utilizada por el sistema o el
                  comercio para identificar la solicitud de pago o parada
                  (propósito estrictamente técnico,no visible al usuario final).


                  **Importancia para Paradas SPIDI:**

                  - Permite conciliar y auditar operaciones entre tu sistema y
                  SPIDI

                  - Sirve para asociar solicitudes de pago con su Parada
                  correspondiente

                  - Puede vincularse a clientes, contratos o facturas en tu
                  plataforma


                  Se recomienda mantener este campo de forma consistente para
                  facilitar la trazabilidad.
                example: '8233232'
              split:
                type: object
                nullable: true
                description: >-
                  Configuración de división de pagos (Request) / Eco del request
                  del split (Response).
                properties:
                  document:
                    type: object
                    nullable: true
                    description: >-
                      Información del documento proporcionado por el owner a los
                      partners para dejar evidencia del split.


                      **Notas importantes:**

                      - Esta información **no implica cálculo fiscal** por parte
                      de SPIDI; es solo comunicación entre owner y partners.

                      - `splitDocument_url` puede ser público con hash o una URL
                      autenticada.

                      - SPIDI **no interpreta ni calcula IVA** a partir de esta
                      información; solo lo transporta.
                    properties:
                      name:
                        type: string
                        nullable: true
                        description: >-
                          Nombre del documento asociado a la transacción split
                          (por ejemplo: factura/recibo/contrato D001-00045678).
                      type:
                        type: string
                        nullable: true
                        description: >-
                          Formato libre del owner donde especifica el tipo de
                          documento.
                        examples:
                          - Factura
                          - Contrato
                          - Recibo
                      date:
                        type: string
                        nullable: true
                        format: date
                        description: >-
                          Fecha de emisión del documento en formato ISO 8601
                          (YYYY-MM-DD).
                      url:
                        type: string
                        nullable: true
                        format: uri
                        description: >-
                          Enlace para visualizar/descargar el documento del
                          split. Puede ser público con hash o una URL
                          autenticada.
                      observations:
                        type: string
                        nullable: true
                        maxLength: 500
                        description: Observaciones libres del owner (máx. 500 caracteres).
                  distribution:
                    type: array
                    nullable: false
                    description: >-
                      Lista de reglas/destinatarios del split. Debe tener ≥ 1
                      ítem. La suma de amount_reference debe ser menor al amount
                      total de la sesión, porque la diferencia restante se
                      asigna automáticamente al owner, quien siempre debe
                      recibir una parte del pago. (Requerido cuando split=true)
                    items:
                      type: object
                      required:
                        - split_recipient_agreement_id
                        - amount_reference
                        - observations
                      properties:
                        split_recipient_agreement_id:
                          type: string
                          nullable: false
                          format: uuid
                          description: >-
                            UUID global SPIDI del agreement de recepción. Este
                            ID se usará en acuerdos de distribución para
                            identificar al receptor del split. (Requerido en
                            distribution)
                        label:
                          type: string
                          nullable: true
                          description: >-
                            Etiqueta descriptiva del receptor en un split.
                            (Opcional en distribution, Eco del request: sí)
                        amount_reference:
                          description: >-
                            Monto de referencia en la moneda especificada en
                            currencyReference con 2 decimales.
                          type: number
                          nullable: false
                          format: double
                          example: '100.001'
                        observations:
                          type: string
                          nullable: false
                          maxLength: 500
                          description: >-
                            Mensaje libre para el partner (máx. 500 caracteres).
                            (Requerido en distribution, Eco del request: sí)
