                                    distribución para identificar al receptor
                                    del split. (Requerido en distribution)
                                partner:
                                  type: object
                                  properties:
                                    observations:
                                      type: string
                                      nullable: false
                                      maxLength: 500
                                      description: >-
                                        Mensaje libre para el partner (máx. 500
                                        caracteres). (Requerido en distribution,
