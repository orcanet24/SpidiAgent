              - status
              - amount
              - created_at
            properties:
              session_id:
                type: string
                description: Identificador único de la sesión de pago
                example: sess_A
              payment_url:
                type: string
                format: uri
                description: Enlace de pago asociado a la sesión
                example: https://pay.spidi.io/sess_A
              status:
                type: string
                enum:
                  - pending
                  - paid
                  - expired
                description: Estado de la sesión de pago
                example: pending
              amount:
                type: object
                required:
                  - value
                  - currency
                properties:
                  value:
                    type: string
                    description: Monto en la moneda especificada
                    example: '15.00'
                  currency:
                    type: string
                    enum:
                      - USD_BCV
                      - EUR_BCV
                      - COP
                      - USDT
                      - VES
                    description: Moneda del monto (VES o moneda de referencia)
                    example: USD_BCV
                description: Monto original de la sesión
              amount_bs:
                type: object
                properties:
                  value:
                    type: string
                    description: Monto expresado en bolívares
                    example: Bs. 552,00
                  rate_date:
                    type: string
                    format: date
                    description: Fecha de la tasa de cambio aplicada
                    example: '2025-10-16'
                description: Monto expresado en Bs. cuando la referencia no es VES
              created_at:
                type: string
                format: date-time
                description: Fecha/hora de creación de la sesión
                example: '2025-10-15T14:25:32Z'
              updated_at:
                type: string
                format: date-time
                description: Fecha/hora de última actualización
                example: '2025-10-15T14:26:10Z'
              expires_at:
                type: string
                format: date-time
                description: >-
                  Vencimiento de la sesión (Botón: 10 min; Solicitud:
                  configurable)
                example: '2025-10-15T14:35:32Z'
              paid_at:
                type: string
                format: date-time
                description: Fecha/hora de confirmación de pago (si paid)
                example: '2025-10-15T14:30:00Z'
              agreement_id:
                type: string
                description: Acuerdo de liquidación aplicado (si existe)
                example: agr_001
              internal_reference:
                type: string
                description: Identificador interno del comercio (requerido en Solicitudes)
                example: INV-9842
              customer_ref:
                type: string
                description: Referencia del cliente (si aplica)
                example: cust_778
              order_index:
                type: integer
                description: Posición relativa en la Parada (para visualización)
                example: 0
              receipt_url:
                type: string
                format: uri
                description: URL del comprobante de pago SPIDI (si paid)
                example: https://pay.spidi.io/receipt/sess_A
              metadata:
                type: object
                description: Datos adicionales definidos por el comercio
                additionalProperties: true
                example:
                  plan: pro
              expiration_behavior:
                type: string
                enum:
                  - expire
                  - message_only
                description: Comportamiento al vencer (solo Solicitudes)
                example: message_only
          description: Lista de sesiones (cada una con su payment_url)
        error:
          type: object
          properties:
            code:
              type: string
              enum:
                - not_found
                - forbidden
                - invalid_cursor
              description: Código de error
              example: not_found
            message:
              type: string
              description: Mensaje de error
              example: Stop not found.
          description: Error específico de esta Parada (si aplica)
    QueryStopsResponse:
      type: object
      required:
        - success
        - requested
        - results
      properties:
        success:
          type: boolean
          description: >-
            **true** si el batch de consulta se procesó (aunque existan errores
            por Parada)
          example: true
        requested:
          type: object
          description: Eco de parámetros aplicados
          properties:
            stop_ids:
              type: array
              items:
                type: string
              example:
                - stp_111
                - stp_222
                - stp_333
            status:
              type: string
              example: active
            per_stop:
              type: object
              properties:
                page_size:
                  type: integer
                  minimum: 1
                  maximum: 200
                  default: 50
                  description: Tamaño por Parada (1..200, default 50)
                  example: 20
                sort:
                  type: string
                  enum:
                    - created_at
                    - updated_at
                    - expires_at
                    - amount
                  default: created_at
                  description: Campo de ordenación
                  example: created_at
                order:
                  type: string
                  enum:
                    - asc
                    - desc
                  default: desc
                  description: Dirección de ordenación
                  example: desc
                only_fields:
                  type: array
                  items:
                    type: string
                  description: >-
                    Limitar campos para reducir payload (p. ej.,
                    ["session_id","payment_url","expires_at"])
                  example:
                    - session_id
                    - payment_url
                    - expires_at
                cursor_by_stop:
                  type: object
                  additionalProperties:
                    type: string
                  description: >-
                    Cursor por Parada para continuar desde una respuesta previa.
                    Usa `next_cursor` por `stop_id` para cargas incrementales
                    eficientes
                  example:
                    stp_111: cur_aaa
                    stp_333: cur_ccc
