          type: string
          description: Identificador interno del comercio (requerido en Solicitudes)
          example: INV-9842
        customer_ref:
          type: string
          description: Referencia del cliente (si aplica)
          example: cust_778
        order_index:
          type: integer
          description: Posición relativa en la Parada (para visualización)
          example: 0
        receipt_url:
          type: string
          format: uri
          description: URL del comprobante de pago SPIDI (si paid)
          example: https://pay.spidi.io/receipt/sess_A
        metadata:
          type: object
          description: Datos adicionales definidos por el comercio
          additionalProperties: true
          example:
            plan: pro
