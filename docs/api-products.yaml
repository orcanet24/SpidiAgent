                          para calcular el monto en bolívares con la tasa
                          vigente.
                      amount_reference:
                        description: >-
                          Monto de referencia en la moneda especificada en
                          currencyReference con 2 decimales.
                        type: number
                        nullable: false
                        format: double
                        example: '100.001'
                      identifier_label:
                        type: string
                        nullable: true
                        description: >-
                          Etiqueta que indica cómo debe interpretarse el valor
