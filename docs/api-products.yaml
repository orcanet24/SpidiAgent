                                8601).
                            bank_name:
                              type: string
                              nullable: true
                              description: 'Nombre comercial del banco. Eco del request: no.'
                            bank_reference_id:
                              type: string
                              nullable: true
                              description: >-
                                Referencia bancaria del pago. Eco del request:
                                no.
                            recipient:
                              type: object
                              properties:
                                id:
                                  type: string
                                  nullable: true
                                  description: Identificador del receptor del crédito.
                                type:
                                  type: string
                                  nullable: true
                                  description: Tipo del receptor del crédito.
                                  enum:
                                    - owner
                                    - partner
