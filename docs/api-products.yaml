components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Requiere el uso de el token obtenido en /auth/login
    BasicAuth:
      type: http
      scheme: basic
      description: >-
        Requiere el uso de las credenciales (Usuario/Contraseña) codificadas en
        Base64
  schemas:
    userSpidi_username:
      type: string
      nullable: false
      description: Nombre de usuario o identificador único del comercio.
    password:
      type: string
      nullable: false
      description: Contraseña de acceso del usuario.
    LoginRequest:
      type: object
      required:
        - short_name
        - password
      properties:
        short_name:
          type: string
          nullable: false
          description: Nombre de usuario o identificador único del comercio.
        password:
          type: string
          nullable: false
          description: Contraseña de acceso del usuario.
    token:
      type: string
      nullable: false
      description: >-
        Token de autorización **JWT** para autenticar requests posteriores. 


        * El token es un **JWT (JSON Web Token)** codificado en Base64.

        * Debe incluirse en el header `Authorization: Bearer {token}` de
        requests posteriores.

        * Tiene un tiempo de expiración definido por seguridad.

        * Contiene información del usuario autenticado y permisos.
    LoginResponse:
      type: object
      required:
        - token
      properties:
        token:
          type: string
          nullable: false
          description: >-
            Token de autorización **JWT** para autenticar requests posteriores. 


            * El token es un **JWT (JSON Web Token)** codificado en Base64.

            * Debe incluirse en el header `Authorization: Bearer {token}` de
            requests posteriores.

            * Tiene un tiempo de expiración definido por seguridad.

            * Contiene información del usuario autenticado y permisos.
    authentication--loginValidationError:
      type: string
      example: The provided credentials are incorrect
      nullable: true
      description: Error general de autenticación.
    LoginErrorResponse:
      type: object
      required:
        - success
        - message
      properties:
        success:
          type: boolean
          example: false
          description: Indica si la operación fue exitosa.
        message:
          type: string
          example: Invalid credentials
          description: Mensaje descriptivo del error.
        errors:
          type: object
          nullable: true
          description: Detalles específicos de los errores de validación.
          properties:
            short_name:
              type: string
              nullable: true
              example: This field is required.
              description: Error relacionado con el campo short_name.
            password:
              type: string
              nullable: true
              example: This field is required.
              description: Error relacionado con el campo password.
            authentication:
              nullable: true
              type: string
              example: The provided credentials are incorrect
              description: Error general de autenticación.
