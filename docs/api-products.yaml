                                  bank_name:
                                    type: string
                                    nullable: true
                                    description: >-
                                      Nombre comercial del banco. Eco del
                                      request: no.
                                  bank_reference_id:
                                    type: string
                                    nullable: true
                                    description: >-
                                      Referencia bancaria del pago. Eco del
                                      request: no.
