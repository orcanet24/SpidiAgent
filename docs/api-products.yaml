          nullable: true
          description: >-
            Etiqueta que indica cómo debe interpretarse el valor enviado en
            identifier (ej. 'Nro de orden').
        identifier:
          type: string
          nullable: false
          description: >-
            Identificador del pagador, interpretado según el valor de
            identifier_label. Ejemplo: Nro de orden, Nombre, etc.
        description:
          type: string
          nullable: true
          description: >-
            Descripción del acuerdo o del concepto de pago asociado a una
            sesión.
          maxLength: 500
        success_url:
          type: string
          nullable: true
          format: uri
          description: >-
            URL de redirección que se utiliza cuando un intento de pago es
            exitoso.
          pattern: ^[a-z1-9]+://[^\s]*$
        failure_url:
          type: string
          nullable: true
          format: uri
          description: URL de redirección que se utiliza cuando un intento de pago falle.
          pattern: ^[a-z1-9]+://[^\s]*$
        webhook_url:
          type: string
          nullable: true
          format: uri
          description: URL para recibir notificaciones de webhook.
        split:
          type: object
          nullable: true
          description: >-
            Configuración de división de pagos (Request) / Eco del request del
            split (Response).
          properties:
            document:
              type: object
              nullable: true
              description: >-
                Información del documento proporcionado por el owner a los
                partners para dejar evidencia del split.


                **Notas importantes:**

                - Esta información **no implica cálculo fiscal** por parte de
                SPIDI; es solo comunicación entre owner y partners.

                - `splitDocument_url` puede ser público con hash o una URL
                autenticada.

                - SPIDI **no interpreta ni calcula IVA** a partir de esta
                información; solo lo transporta.
              properties:
                name:
                  type: string
                  nullable: true
                  description: >-
                    Nombre del documento asociado a la transacción split (por
                    ejemplo: factura/recibo/contrato D001-00045678).
                type:
                  type: string
                  nullable: true
                  description: >-
                    Formato libre del owner donde especifica el tipo de
                    documento.
                  examples:
                    - Factura
                    - Contrato
                    - Recibo
                date:
                  type: string
                  nullable: true
                  format: date
                  description: >-
                    Fecha de emisión del documento en formato ISO 8601
                    (YYYY-MM-DD).
                url:
                  type: string
                  nullable: true
                  format: uri
                  description: >-
                    Enlace para visualizar/descargar el documento del split.
                    Puede ser público con hash o una URL autenticada.
                observations:
                  type: string
                  nullable: true
                  maxLength: 500
                  description: Observaciones libres del owner (máx. 500 caracteres).
            distribution:
              type: array
              nullable: false
              description: >-
                Lista de reglas/destinatarios del split. Debe tener ≥ 1 ítem. La
                suma de amount_reference debe ser menor al amount total de la
                sesión, porque la diferencia restante se asigna automáticamente
                al owner, quien siempre debe recibir una parte del pago.
                (Requerido cuando split=true)
              items:
                type: object
                required:
                  - split_recipient_agreement_id
                  - amount_reference
                  - observations
                properties:
                  split_recipient_agreement_id:
                    type: string
                    nullable: false
                    format: uuid
                    description: >-
                      UUID global SPIDI del agreement de recepción. Este ID se
                      usará en acuerdos de distribución para identificar al
                      receptor del split. (Requerido en distribution)
                  label:
                    type: string
                    nullable: true
                    description: >-
                      Etiqueta descriptiva del receptor en un split. (Opcional
                      en distribution, Eco del request: sí)
                  amount_reference:
                    description: >-
                      Monto de referencia en la moneda especificada en
                      currencyReference con 2 decimales.
                    type: number
                    nullable: false
                    format: double
                    example: '100.001'
                  observations:
                    type: string
                    nullable: false
                    maxLength: 500
                    description: >-
                      Mensaje libre para el partner (máx. 500 caracteres).
                      (Requerido en distribution, Eco del request: sí)
        config:
          type: array
          description: >-
            Configuración dinámica opcional para personalizar la experiencia
            comercial del botón de pago.
          items:
            type: object
            properties:
              type:
                type: string
                description: >-
                  Identificador de la configuración a aplicar. Por ejemplo,
                  'initial_currency' sirve para priorizar qué método de pago
                  (fiat o cripto) se muestra por defecto al usuario.
              value:
                description: >-
                  Valor asociado a la configuración. Para 'initial_currency',
                  debe seguir el estándar ISO 4217 para monedas fiduciarias o
                  'CRYPTO' para activos digitales.
                enum:
                  - VES
                  - CRYPTO
            required:
              - type
              - value
            example:
              type: initial_currency
              value: CRYPTO
        duration_minutes:
          type: integer
          nullable: true
          description: Duración en minutos de la sesión.
          minimum: 5
          maximum: 20
          example: 5
