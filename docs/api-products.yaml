                              rate_col_ves:
                                type: number
                                format: decimal(10,4)
                                nullable: true
                                description: Tasa de cambio COP a VES.
                          receiver_credits:
                            type: object
                            nullable: true
                            description: >-
                              Detalles de la liquidación de créditos (Owner y
