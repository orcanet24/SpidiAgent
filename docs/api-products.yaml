  /api/v1/ext/payment-stops/payment-sessions/query:
    post:
      summary: Consultar Enlaces de Múltiples Paradas
      description: >-
        Devuelve, en una sola llamada, los solicitudes de pago activas
        (derivados de sesiones `pending`) para varias Paradas (`stop_id`).


        Incluye paginación por Parada, filtros básicos y posibilidad de limitar
        campos para reducir payload.


        **¿Por qué POST para "leer"?**

        Acepta listas grandes de `stop_id` (hasta 200) y tokens de paginación
        por Parada; un `GET` se quedaría corto por límites de longitud de URL.
        Este patrón es común en APIs modernas (Google Cloud, AWS) para queries
        complejas.


        **Características:**

        - Optimizado para **UI cliente** - devuelve **solo activos por defecto**
        (`status=pending`)

        - Paginación cursor-based por parada

        - Rate limit: 100 requests/minuto por comercio

        - Máximo: 200 `stop_ids` por request


        **Notas importantes:**

        - Si necesitas histórico, usa `status: "historical"` o `include_history:
        true` en el request

        - Para más de 200 stops, realiza múltiples requests

        - Este endpoint es idempotente (lectura) y cacheable


        > **Hoy esta operación no responde en pruebas.** Está declarada en el
        contrato, pero todavía no está activa: si la llamas no vas a recibir
        nada, y el problema no es tuyo. Lo que puedes hacer mientras tanto está
        en [Estado de la plataforma](/recursos/estado-de-la-plataforma).
      operationId: queryMultipleStops
      tags:
        - Endpoints Publicar
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - stop_ids
              properties:
                stop_ids:
                  type: array
                  minItems: 1
                  maxItems: 200
                  items:
                    type: string
                  description: >-
                    Lista de Paradas a consultar (máx. recomendado: 200 por
                    request)
                  example:
                    - stp_111
                    - stp_222
                    - stp_333
                status:
                  type: string
                  enum:
                    - active
                    - pending
                    - paid
                    - expired
                    - historical
                  default: active
                  description: >-
                    Filtro de estado: **active** (default, alias de
                    **pending**), **pending**, **paid**, **expired**,
                    **historical** (paid+expired)
                  example: active
                per_stop:
                  description: Configuración de paginación y filtros por Parada
                  type: object
                  properties:
                    page_size:
                      type: integer
                      minimum: 1
                      maximum: 200
                      default: 50
                      description: Tamaño por Parada (1..200, default 50)
                      example: 20
                    sort:
                      type: string
                      enum:
                        - created_at
                        - updated_at
                        - expires_at
                        - amount
                      default: created_at
                      description: Campo de ordenación
                      example: created_at
                    order:
                      type: string
                      enum:
                        - asc
                        - desc
                      default: desc
                      description: Dirección de ordenación
                      example: desc
                    only_fields:
                      type: array
                      items:
                        type: string
                      description: >-
                        Limitar campos para reducir payload (p. ej.,
                        ["session_id","payment_url","expires_at"])
                      example:
                        - session_id
                        - payment_url
                        - expires_at
                    cursor_by_stop:
                      type: object
                      additionalProperties:
                        type: string
                      description: >-
                        Cursor por Parada para continuar desde una respuesta
                        previa. Usa `next_cursor` por `stop_id` para cargas
                        incrementales eficientes
                      example:
                        stp_111: cur_aaa
                        stp_333: cur_ccc
            examples:
              simple_query:
                summary: Consulta simple (solo activos)
                value:
                  stop_ids:
                    - stp_111
                    - stp_222
                    - stp_333
              with_pagination:
                summary: Con paginación y campos mínimos
                value:
                  stop_ids:
                    - stp_111
                    - stp_222
                  per_stop:
                    page_size: 20
                    sort: created_at
                    order: desc
                    only_fields:
                      - session_id
                      - payment_url
                      - expires_at
              with_cursors:
                summary: Reanudación por Parada (usando next_cursor previo)
                value:
                  stop_ids:
                    - stp_111
                    - stp_222
                    - stp_333
                  per_stop:
                    cursor_by_stop:
                      stp_111: cur_aaa
                      stp_333: cur_ccc
                    page_size: 50
      responses:
        '200':
          description: Consulta procesada exitosamente
          headers:
            X-Total-Stops:
              description: Número total de paradas consultadas
              schema:
                type: integer
                example: 3
            X-RateLimit-Limit:
              description: Límite de requests por ventana
              schema:
                type: integer
                example: 100
            X-RateLimit-Remaining:
              description: Requests restantes en la ventana actual
              schema:
                type: integer
                example: 95
            X-RateLimit-Reset:
              description: Timestamp Unix cuando se resetea el límite
              schema:
                type: integer
                example: 1702814181
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - requested
                  - results
                properties:
                  success:
                    type: boolean
                    description: >-
                      **true** si el batch de consulta se procesó (aunque
                      existan errores por Parada)
                    example: true
                  requested:
                    type: object
                    description: Eco de parámetros aplicados
                    properties:
                      stop_ids:
                        type: array
                        items:
                          type: string
                        example:
                          - stp_111
                          - stp_222
                          - stp_333
                      status:
                        type: string
                        example: active
                      per_stop:
                        type: object
                        properties:
                          page_size:
                            type: integer
                            minimum: 1
                            maximum: 200
                            default: 50
                            description: Tamaño por Parada (1..200, default 50)
                            example: 20
                          sort:
                            type: string
                            enum:
                              - created_at
                              - updated_at
                              - expires_at
                              - amount
                            default: created_at
                            description: Campo de ordenación
                            example: created_at
                          order:
                            type: string
                            enum:
                              - asc
                              - desc
                            default: desc
                            description: Dirección de ordenación
                            example: desc
                          only_fields:
                            type: array
                            items:
                              type: string
                            description: >-
                              Limitar campos para reducir payload (p. ej.,
                              ["session_id","payment_url","expires_at"])
                            example:
                              - session_id
                              - payment_url
                              - expires_at
                          cursor_by_stop:
                            type: object
                            additionalProperties:
                              type: string
                            description: >-
                              Cursor por Parada para continuar desde una
                              respuesta previa. Usa `next_cursor` por `stop_id`
                              para cargas incrementales eficientes
                            example:
                              stp_111: cur_aaa
                              stp_333: cur_ccc
                  results:
                    type: array
                    items:
                      type: object
                      required:
                        - stop_id
                      properties:
                        stop_id:
                          type: string
                          description: Parada consultada
                          example: stp_111
                        page_size:
                          type: integer
                          description: Tamaño aplicado por Parada
                          example: 20
                        has_next:
                          type: boolean
                          description: Si hay más resultados
                          example: true
                        next_cursor:
                          type: string
                          description: Cursor para continuar la paginación de esa Parada
                          example: cur_aaa_next
                        total_estimate:
                          type: integer
                          description: Estimación rápida del total (opcional)
                          example: 72
                        items:
                          type: array
                          items:
                            type: object
                            required:
                              - session_id
                              - payment_url
                              - status
                              - amount
                              - created_at
                            properties:
                              session_id:
                                type: string
                                description: Identificador único de la sesión de pago
                                example: sess_A
                              payment_url:
                                type: string
                                format: uri
                                description: Enlace de pago asociado a la sesión
                                example: https://pay.spidi.io/sess_A
                              status:
                                type: string
                                enum:
                                  - pending
                                  - paid
                                  - expired
                                description: Estado de la sesión de pago
                                example: pending
                              amount:
                                type: object
                                required:
                                  - value
                                  - currency
                                properties:
                                  value:
                                    type: string
                                    description: Monto en la moneda especificada
                                    example: '15.00'
                                  currency:
                                    type: string
                                    enum:
                                      - USD_BCV
                                      - EUR_BCV
                                      - COP
                                      - USDT
                                      - VES
                                    description: >-
                                      Moneda del monto (VES o moneda de
                                      referencia)
                                    example: USD_BCV
                                description: Monto original de la sesión
                              amount_bs:
                                type: object
                                properties:
                                  value:
                                    type: string
                                    description: Monto expresado en bolívares
                                    example: Bs. 552,00
                                  rate_date:
                                    type: string
                                    format: date
                                    description: Fecha de la tasa de cambio aplicada
                                    example: '2025-10-16'
                                description: >-
                                  Monto expresado en Bs. cuando la referencia no
                                  es VES
                              created_at:
                                type: string
                                format: date-time
                                description: Fecha/hora de creación de la sesión
                                example: '2025-10-15T14:25:32Z'
                              updated_at:
                                type: string
                                format: date-time
                                description: Fecha/hora de última actualización
                                example: '2025-10-15T14:26:10Z'
                              expires_at:
                                type: string
                                format: date-time
                                description: >-
                                  Vencimiento de la sesión (Botón: 10 min;
                                  Solicitud: configurable)
                                example: '2025-10-15T14:35:32Z'
                              paid_at:
                                type: string
                                format: date-time
                                description: Fecha/hora de confirmación de pago (si paid)
                                example: '2025-10-15T14:30:00Z'
                              agreement_id:
                                type: string
                                description: Acuerdo de liquidación aplicado (si existe)
                                example: agr_001
                              internal_reference:
                                type: string
                                description: >-
                                  Identificador interno del comercio (requerido
                                  en Solicitudes)
                                example: INV-9842
                              customer_ref:
                                type: string
                                description: Referencia del cliente (si aplica)
                                example: cust_778
                              order_index:
                                type: integer
                                description: >-
                                  Posición relativa en la Parada (para
                                  visualización)
                                example: 0
                              receipt_url:
                                type: string
                                format: uri
                                description: URL del comprobante de pago SPIDI (si paid)
                                example: https://pay.spidi.io/receipt/sess_A
                              metadata:
                                type: object
                                description: Datos adicionales definidos por el comercio
                                additionalProperties: true
                                example:
                                  plan: pro
                              expiration_behavior:
                                type: string
                                enum:
                                  - expire
                                  - message_only
                                description: Comportamiento al vencer (solo Solicitudes)
                                example: message_only
                          description: Lista de sesiones (cada una con su payment_url)
                        error:
                          type: object
                          properties:
                            code:
                              type: string
                              enum:
                                - not_found
                                - forbidden
                                - invalid_cursor
                              description: Código de error
                              example: not_found
                            message:
                              type: string
                              description: Mensaje de error
                              example: Stop not found.
                          description: Error específico de esta Parada (si aplica)
                    description: Resultado por stop_id
                    example:
                      - stop_id: stp_111
                        page_size: 20
                        has_next: true
                        next_cursor: cur_aaa_next
                        total_estimate: 72
                        items:
                          - session_id: sess_A
                            payment_url: https://pay.spidi.io/sess_A
                            status: pending
                            amount:
                              value: '15.00'
                              currency: USD_BCV
                            amount_bs:
                              value: Bs. 552,00
                              rate_date: '2025-10-16'
