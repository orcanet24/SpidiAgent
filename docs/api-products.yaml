      required:
        - success
        - message
      properties:
        success:
          type: boolean
          example: false
          description: Indica si la operación fue exitosa.
        message:
          type: string
          example: Session not found.
          description: Mensaje descriptivo del error.
        errors:
          type: object
          nullable: true
          description: Detalles específicos de los errores.
          properties:
            session_id:
              type: string
              example: This field is required.
              description: Error relacionado con el campo session_id.
            spidi_id:
              type: string
              example: The credentials are incorrect
              description: Error de autenticación.
            message:
              type: string
              example: No tienes permisos para esta operación
              description: Mensaje de error genérico.
    continueOnerror:
      type: boolean
      nullable: true
      default: false
      description: >-
        Indica si el procesamiento debe continuar con el resto de los ítems
        aunque alguno falle en operaciones de batch.

        - Si es `false`, se detiene en el primer error y las operaciones ya
        exitosas permanecen válidas. 

        - Si es `true`, continúa procesando hasta el final y luego reporta las
        fallas acumuladas.
      example: true
    landing_title:
      type: string
      nullable: false
      description: Título de la landing page creada por SPIDI.
      example: Pago de Servicios
    due_date_session:
      type: string
      nullable: true
      format: date-time
      description: Fecha y hora límite de vencimiento de la Solicitud SPIDI (sesión).
    due_date_reached_behavior:
      type: string
      nullable: true
      enum:
        - keep_active
        - expire
      description: >-
        Comportamiento configurado para cuando la sesión alcance su fecha de
        vencimiento.
    late_notice_message:
      type: string
      nullable: true
      description: >-
        Mensaje que verá el pagador cuando la sesión haya vencido pero continúe
        activa (keep_active).
    internal_reference:
      type: string
      nullable: false
      description: >-
        Referencia interna única utilizada por el sistema o el comercio para
        identificar la solicitud de pago o parada (propósito estrictamente
        técnico,no visible al usuario final).


        **Importancia para Paradas SPIDI:**

        - Permite conciliar y auditar operaciones entre tu sistema y SPIDI

        - Sirve para asociar solicitudes de pago con su Parada correspondiente

        - Puede vincularse a clientes, contratos o facturas en tu plataforma


        Se recomienda mantener este campo de forma consistente para facilitar la
        trazabilidad.
      example: '8233232'
    PaymentSessionRequestBatchRequest:
      type: object
      required:
        - continue_on_error
        - items
      properties:
        continue_on_error:
          type: boolean
          nullable: true
          default: false
          description: >-
            Indica si el procesamiento debe continuar con el resto de los ítems
            aunque alguno falle en operaciones de batch.

            - Si es `false`, se detiene en el primer error y las operaciones ya
            exitosas permanecen válidas. 

            - Si es `true`, continúa procesando hasta el final y luego reporta
            las fallas acumuladas.
          example: true
        items:
          type: array
          description: Array de objetos con los datos de cada sesión de pago a crear.
          minItems: 1
          items:
            type: object
            required:
              - title
              - agreement_id
              - currency_reference
              - amount_reference
              - identifier
              - due_date_session
              - due_date_reached_behavior
              - late_notice_message
              - internal_reference
            properties:
              title:
                type: string
                nullable: false
                description: Título de la landing page creada por SPIDI.
                example: Pago de Servicios
              agreement_id:
                type: string
                format: uuid
                nullable: true
                description: >-
                  Identificador único del acuerdo de liquidación. Debe ser UUID
                  v4.
              currency_reference:
                type: string
                nullable: false
                enum:
                  - USD
                  - EUR
                  - COP
                  - USDT
                  - VES
                description: >-
                  Moneda de referencia que se fija para el pago. Usada para
                  calcular el monto en bolívares con la tasa vigente.
              amount_reference:
                description: >-
                  Monto de referencia en la moneda especificada en
                  currencyReference con 2 decimales.
                type: number
                nullable: false
                format: double
                example: '100.001'
              identifier_label:
                type: string
                nullable: true
                description: >-
                  Etiqueta que indica cómo debe interpretarse el valor enviado
                  en identifier (ej. 'Nro de orden').
              identifier:
                type: string
                nullable: false
                description: >-
                  Identificador del pagador, interpretado según el valor de
                  identifier_label. Ejemplo: Nro de orden, Nombre, etc.
              description:
                type: string
                nullable: true
                description: >-
                  Descripción del acuerdo o del concepto de pago asociado a una
                  sesión.
                maxLength: 500
              success_url:
                type: string
                nullable: true
                format: uri
                description: >-
                  URL de redirección que se utiliza cuando un intento de pago es
                  exitoso.
                pattern: ^[a-z1-9]+://[^\s]*$
              failure_url:
                type: string
                nullable: true
                format: uri
                description: >-
                  URL de redirección que se utiliza cuando un intento de pago
                  falle.
