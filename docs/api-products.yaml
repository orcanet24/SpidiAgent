  /api/v1/ext/payment-stops/{stop_id}/payment-sessions:
    get:
      summary: Consultar Históricos de Solicitudes de Parada
      description: >-
        Consulta el historial completo de solicitudes de pago asociados a una
        Parada SPIDI.


        Devuelve la lista completa de solicitudes de pago asociados a un
        `stop_id`, incluyendo:

        - **Sesiones de Pago Activas** (`pending`)

        - **Sesiones de Pago Pagadas ** (`paid`)

        - **Sesiones de Pago Expiradas** (`expired`)


        Soporta filtros avanzados por estado, rango de fechas y paginación para
        manejar colecciones grandes.


        **Diferencia con ```GET /payment-stops/{stop_id}```:**

        - El endpoint básico solo devuelve solicitudes de pago activas

        - Este endpoint devuelve el historial completo con opciones de filtrado
        y paginación


        > **Hoy esta operación no responde en pruebas.** Está declarada en el
        contrato, pero todavía no está activa: si la llamas no vas a recibir
        nada, y el problema no es tuyo. Lo que puedes hacer mientras tanto está
        en [Estado de la plataforma](/recursos/estado-de-la-plataforma).
      operationId: getStopPaymentSessionsHistory
      tags:
        - Endpoints Parada
      security:
        - bearerAuth: []
      parameters:
        - name: stop_id
          in: path
          description: Identificador único de la parada (UUID)
          required: true
          schema:
            type: string
            format: uuid
            example: 7f8b2c6a-4d19-45df-9a10-3e872aa812c1
