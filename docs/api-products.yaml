  /api/v1/ext/payment-sessions/request/batch:
    post:
      summary: Crear Sesión(es)
      description: >-
        Permite crear una o múltiples sesiones de pago en forma de batch para
        solicitudes de pago. Cada item del batch contiene los campos de una
        sesión de pago más campos específicos para el manejo de vencimientos y
        notificaciones tardías.
      operationId: createPaymentSessionRequestBatch
      tags:
        - Endpoints Solicitud
      security:
        - bearerAuth: []
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - continue_on_error
                - items
              properties:
                continue_on_error:
                  type: boolean
                  nullable: true
                  default: false
                  description: >-
                    Indica si el procesamiento debe continuar con el resto de
                    los ítems aunque alguno falle en operaciones de batch.

                    - Si es `false`, se detiene en el primer error y las
                    operaciones ya exitosas permanecen válidas. 

                    - Si es `true`, continúa procesando hasta el final y luego
                    reporta las fallas acumuladas.
                  example: true
                items:
                  type: array
                  description: >-
                    Array de objetos con los datos de cada sesión de pago a
                    crear.
                  minItems: 1
                  items:
                    type: object
                    required:
                      - title
                      - agreement_id
                      - currency_reference
                      - amount_reference
                      - identifier
                      - due_date_session
                      - due_date_reached_behavior
                      - late_notice_message
                      - internal_reference
                    properties:
                      title:
                        type: string
                        nullable: false
                        description: Título de la landing page creada por SPIDI.
                        example: Pago de Servicios
                      agreement_id:
                        type: string
                        format: uuid
                        nullable: true
                        description: >-
                          Identificador único del acuerdo de liquidación. Debe
                          ser UUID v4.
                      currency_reference:
                        type: string
                        nullable: false
                        enum:
                          - USD
                          - EUR
                          - COP
                          - USDT
                          - VES
                        description: >-
                          Moneda de referencia que se fija para el pago. Usada
                          para calcular el monto en bolívares con la tasa
                          vigente.
                      amount_reference:
                        description: >-
                          Monto de referencia en la moneda especificada en
                          currencyReference con 2 decimales.
                        type: number
                        nullable: false
                        format: double
                        example: '100.001'
                      identifier_label:
                        type: string
                        nullable: true
                        description: >-
                          Etiqueta que indica cómo debe interpretarse el valor
                          enviado en identifier (ej. 'Nro de orden').
                      identifier:
                        type: string
                        nullable: false
                        description: >-
                          Identificador del pagador, interpretado según el valor
                          de identifier_label. Ejemplo: Nro de orden, Nombre,
                          etc.
                      description:
                        type: string
                        nullable: true
                        description: >-
                          Descripción del acuerdo o del concepto de pago
                          asociado a una sesión.
                        maxLength: 500
                      success_url:
                        type: string
                        nullable: true
                        format: uri
                        description: >-
                          URL de redirección que se utiliza cuando un intento de
                          pago es exitoso.
                        pattern: ^[a-z1-9]+://[^\s]*$
                      failure_url:
                        type: string
                        nullable: true
                        format: uri
                        description: >-
                          URL de redirección que se utiliza cuando un intento de
                          pago falle.
                        pattern: ^[a-z1-9]+://[^\s]*$
                      webhook_url:
                        type: string
                        nullable: true
                        format: uri
                        description: URL para recibir notificaciones de webhook.
                      due_date_session:
                        type: string
                        nullable: true
                        format: date-time
                        description: >-
                          Fecha y hora límite de vencimiento de la Solicitud
                          SPIDI (sesión).
                      due_date_reached_behavior:
                        type: string
                        nullable: true
                        enum:
                          - keep_active
                          - expire
                        description: >-
                          Comportamiento configurado para cuando la sesión
                          alcance su fecha de vencimiento.
                      late_notice_message:
                        type: string
                        nullable: true
                        description: >-
                          Mensaje que verá el pagador cuando la sesión haya
                          vencido pero continúe activa (keep_active).
                      internal_reference:
                        type: string
                        nullable: false
                        description: >-
                          Referencia interna única utilizada por el sistema o el
                          comercio para identificar la solicitud de pago o
                          parada (propósito estrictamente técnico,no visible al
                          usuario final).


                          **Importancia para Paradas SPIDI:**

                          - Permite conciliar y auditar operaciones entre tu
                          sistema y SPIDI

                          - Sirve para asociar solicitudes de pago con su Parada
                          correspondiente

                          - Puede vincularse a clientes, contratos o facturas en
                          tu plataforma


                          Se recomienda mantener este campo de forma consistente
                          para facilitar la trazabilidad.
                        example: '8233232'
                      split:
                        type: object
                        nullable: true
                        description: >-
                          Configuración de división de pagos (Request) / Eco del
                          request del split (Response).
                        properties:
                          document:
                            type: object
                            nullable: true
                            description: >-
                              Información del documento proporcionado por el
                              owner a los partners para dejar evidencia del
                              split.


                              **Notas importantes:**

                              - Esta información **no implica cálculo fiscal**
                              por parte de SPIDI; es solo comunicación entre
                              owner y partners.

                              - `splitDocument_url` puede ser público con hash o
                              una URL autenticada.

                              - SPIDI **no interpreta ni calcula IVA** a partir
                              de esta información; solo lo transporta.
                            properties:
                              name:
                                type: string
                                nullable: true
                                description: >-
                                  Nombre del documento asociado a la transacción
                                  split (por ejemplo: factura/recibo/contrato
                                  D001-00045678).
                              type:
                                type: string
                                nullable: true
                                description: >-
                                  Formato libre del owner donde especifica el
                                  tipo de documento.
                                examples:
                                  - Factura
                                  - Contrato
                                  - Recibo
                              date:
                                type: string
                                nullable: true
                                format: date
                                description: >-
                                  Fecha de emisión del documento en formato ISO
                                  8601 (YYYY-MM-DD).
                              url:
                                type: string
                                nullable: true
                                format: uri
                                description: >-
                                  Enlace para visualizar/descargar el documento
                                  del split. Puede ser público con hash o una
                                  URL autenticada.
                              observations:
                                type: string
                                nullable: true
                                maxLength: 500
                                description: >-
                                  Observaciones libres del owner (máx. 500
                                  caracteres).
                          distribution:
                            type: array
                            nullable: false
                            description: >-
                              Lista de reglas/destinatarios del split. Debe
                              tener ≥ 1 ítem. La suma de amount_reference debe
                              ser menor al amount total de la sesión, porque la
                              diferencia restante se asigna automáticamente al
                              owner, quien siempre debe recibir una parte del
                              pago. (Requerido cuando split=true)
                            items:
                              type: object
                              required:
                                - split_recipient_agreement_id
                                - amount_reference
                                - observations
                              properties:
                                split_recipient_agreement_id:
                                  type: string
                                  nullable: false
                                  format: uuid
                                  description: >-
                                    UUID global SPIDI del agreement de
                                    recepción. Este ID se usará en acuerdos de
                                    distribución para identificar al receptor
                                    del split. (Requerido en distribution)
                                label:
                                  type: string
                                  nullable: true
                                  description: >-
                                    Etiqueta descriptiva del receptor en un
                                    split. (Opcional en distribution, Eco del
                                    request: sí)
                                amount_reference:
                                  description: >-
                                    Monto de referencia en la moneda
                                    especificada en currencyReference con 2
                                    decimales.
                                  type: number
                                  nullable: false
                                  format: double
                                  example: '100.001'
                                observations:
                                  type: string
                                  nullable: false
                                  maxLength: 500
                                  description: >-
