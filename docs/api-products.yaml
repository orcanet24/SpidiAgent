        administrativas. Este contenido no es visible para el cliente final y se
        utiliza exclusivamente para trazabilidad recomienda usarlo con esta
        estructura: (quién, cuándo, por qué).
      example: >-
        La orden se habia generado de forma automatizada pero el usuario liquido
        la la sesión en nuestra sucursal por medio de pagos en efectivo.
