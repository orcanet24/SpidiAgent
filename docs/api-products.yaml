                enum:
                  - add
                  - remove
                  - replace
                  - clear
                description: >-
                  Operación a ejecutar: **add** (agregar sesiones), **remove**
                  (desasociar sesiones), **replace** (reemplazar conjunto
                  activo), **clear** (limpiar todos los activos)
                example: add
              session_ids:
                type: array
                items:
                  type: string
                description: >-
                  IDs de sesiones involucradas. Requerido para operaciones add,
                  remove y replace. Solo sesiones en estado **pending** pueden
                  activarse (add/replace).
                example:
                  - sess_A
                  - sess_B
          description: Lista de operaciones por Parada. Debe contener al menos 1 ítem.
          example:
