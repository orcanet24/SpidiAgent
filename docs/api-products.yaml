                                properties:
                                  receiver_id:
                                    type: string
                                    nullable: true
                                    description: Identificador del receptor del crédito.
                                  memo:
                                    type: string
                                    nullable: true
                                    description: Nota o referencia interna para el crédito.
                                  spidi_credit_id:
                                    type: string
                                    nullable: true
                                    description: ID de la liquidación al receptor del pago.
                                  amount_ves_credited:
                                    type: number
                                    nullable: true
                                    description: >-
                                      Monto neto acreditado al receptor en
