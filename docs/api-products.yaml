webhooks:
  payment_session.created:
    post:
      operationId: paymentSessionCreated
      tags:
        - Webhooks
      summary: Evento de creación de sesión
      description: >-
        Se produce cuando se crea una nueva sesión de pago. Esta sesión queda
        disponible para que el pagador realice el pago correspondiente. Se
        enviará una notificación de este evento mediante un webhook cuando se
        crea una nueva sesión de pago.
      parameters:
        - name: spidi-signature
          in: header
          required: true
          description: >-
            Firma HMAC-SHA256 para validar la autenticidad e integridad del
            mensaje.
          schema:
            type: string
            example: d9c8227652758252615617f6a8759526703902939d892376987f22387a672889
        - name: spidi-timestamp
          in: header
          required: true
          description: >-
            Timestamp ISO 8601 de la creación del evento para prevenir ataques
            de replay.
          schema:
            type: string
            format: date-time
            example: '2026-02-06T15:24:36.000Z'
        - name: idempotency-key
          in: header
          required: true
          description: >-
            UUID v4 único para garantizar que la operación se procese una sola
            vez.
          schema:
            type: string
            format: uuid
            example: 93465a7e-ea9b-41a8-8dca-14e811641c25
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - event
                - data
              properties:
                event:
                  type: string
                  enum:
                    - payment_session.created
                  description: >-
                    Tipo de evento siguiendo el estándar de jerarquía por
                    puntos.
                data:
                  type: object
                  properties:
                    session_id:
                      type: string
                      nullable: false
                      description: >-
                        Identificador único de la sesión de pago, accedible a
                        través del payment_url.
                    session_origin:
                      type: string
                      nullable: false
                      enum:
                        - button
                        - request
                      description: >-
                        Origen de la sesión: 'button' (Botón de pago) o
                        'request' (Solicitud SPIDI).
                    status:
                      type: string
                      nullable: false
                      enum:
                        - pending
                        - paid
                        - failed
                        - expired
                      description: >-
                        Estado actual de la sesión. El valor failed solo se
                        aplica para sesiones creadas con botón de pago.
                    identifier_label:
                      type: string
                      nullable: true
                      description: >-
                        Etiqueta que indica cómo debe interpretarse el valor
                        enviado en identifier (ej. 'Nro de orden').
                    identifier:
                      type: string
                      nullable: false
                      description: >-
                        Identificador del pagador, interpretado según el valor
                        de identifier_label. Ejemplo: Nro de orden, Nombre, etc.
                    description:
                      type: string
                      nullable: true
                      description: >-
                        Descripción del acuerdo o del concepto de pago asociado
                        a una sesión.
                      maxLength: 500
                    payment_method:
                      type: string
                      nullable: true
                      enum:
                        - crypto
                        - immediate_debit
                        - mobile_payment
                      description: 'Método de pago utilizado. Eco del request: no.'
                    amount_reference:
                      description: >-
                        Monto de referencia en la moneda especificada en
                        currencyReference con 2 decimales.
                      type: number
                      nullable: false
                      format: double
                      example: '100.001'
                    currency_reference:
                      type: string
                      nullable: false
                      enum:
                        - USD
                        - EUR
                        - COP
                        - USDT
                        - VES
                      description: >-
                        Moneda de referencia que se fija para el pago. Usada
                        para calcular el monto en bolívares con la tasa vigente.
                    success_url:
                      type: string
                      nullable: true
                      format: uri
                      description: >-
                        URL de redirección que se utiliza cuando un intento de
                        pago es exitoso.
                      pattern: ^[a-z1-9]+://[^\s]*$
                    failure_url:
                      type: string
                      nullable: true
                      format: uri
                      description: >-
                        URL de redirección que se utiliza cuando un intento de
                        pago falle.
                      pattern: ^[a-z1-9]+://[^\s]*$
                    webhook_url:
                      type: string
                      nullable: true
                      format: uri
                      description: URL para recibir notificaciones de webhook.
                    split:
                      type: object
                      nullable: true
                      description: >-
                        Configuración de división de pagos (Request) / Eco del
                        request del split (Response).
                      properties:
                        document:
                          type: object
                          nullable: true
                          description: >-
                            Información del documento proporcionado por el owner
                            a los partners para dejar evidencia del split.


                            **Notas importantes:**

                            - Esta información **no implica cálculo fiscal** por
                            parte de SPIDI; es solo comunicación entre owner y
                            partners.

                            - `splitDocument_url` puede ser público con hash o
                            una URL autenticada.

                            - SPIDI **no interpreta ni calcula IVA** a partir de
                            esta información; solo lo transporta.
                          properties:
                            name:
                              type: string
                              nullable: true
                              description: >-
                                Nombre del documento asociado a la transacción
                                split (por ejemplo: factura/recibo/contrato
                                D001-00045678).
                            type:
                              type: string
                              nullable: true
                              description: >-
                                Formato libre del owner donde especifica el tipo
                                de documento.
                              examples:
                                - Factura
                                - Contrato
                                - Recibo
                            date:
                              type: string
                              nullable: true
                              format: date
                              description: >-
                                Fecha de emisión del documento en formato ISO
                                8601 (YYYY-MM-DD).
                            url:
                              type: string
                              nullable: true
                              format: uri
                              description: >-
                                Enlace para visualizar/descargar el documento
                                del split. Puede ser público con hash o una URL
                                autenticada.
                            observations:
                              type: string
                              nullable: true
                              maxLength: 500
                              description: >-
                                Observaciones libres del owner (máx. 500
                                caracteres).
                        distribution:
                          type: array
                          nullable: false
                          description: >-
                            Lista de reglas/destinatarios del split. Debe tener
                            ≥ 1 ítem. La suma de amount_reference debe ser menor
                            al amount total de la sesión, porque la diferencia
                            restante se asigna automáticamente al owner, quien
                            siempre debe recibir una parte del pago. (Requerido
                            cuando split=true)
                          items:
                            type: object
                            required:
                              - split_recipient_agreement_id
                              - amount_reference
                              - observations
                            properties:
                              split_recipient_agreement_id:
                                type: string
                                nullable: false
                                format: uuid
                                description: >-
                                  UUID global SPIDI del agreement de recepción.
                                  Este ID se usará en acuerdos de distribución
                                  para identificar al receptor del split.
                                  (Requerido en distribution)
                              label:
                                type: string
                                nullable: true
                                description: >-
                                  Etiqueta descriptiva del receptor en un split.
                                  (Opcional en distribution, Eco del request:
                                  sí)
                              amount_reference:
                                description: >-
                                  Monto de referencia en la moneda especificada
                                  en currencyReference con 2 decimales.
                                type: number
                                nullable: false
                                format: double
                                example: '100.001'
                              observations:
                                type: string
                                nullable: false
                                maxLength: 500
                                description: >-
                                  Mensaje libre para el partner (máx. 500
                                  caracteres). (Requerido en distribution, Eco
                                  del request: sí)
            examples:
              creacion_exitosa:
                summary: Ejemplo de request recibo por el webhook
                value:
                  event: payment_session.created
                  data:
                    session_id: ce075ab5-a4e0-4d16-8281-a27fced565f2
                    session_origin: button
                    status: pending
                    identifier_label: Nombre del cliente
                    identifier: Juan Pérez
                    description: Pago de servicio de internet
                    payment_method: immediate_debit
                    amount_reference: 5
                    currency_reference: VES
                    success_url: miapp://pago/exitoso
                    failure_url: miapp://pago/fallido
                    webhook_url: https://miapi.com/spidi/webhook
                    split:
                      document:
                        document_name: D001-00045678
                        document_type: Factura
                        document_date: '2025-10-20'
                        document_url: https://owner.com/document/D001-00045678
                        document_observations: any observation to owner
                      distribution:
                        - split_recipient_agreement_id: rcv_014…723c1a2
                          label: Partner 1
                          amount_reference: 10
                          observations: any observation to communicate to Partner 1
                        - split_recipient_agreement_id: rcv_016…112dde3
                          label: Partner 2
                          amount_reference: 0
                          observations: any observation to communicate to Partner 2
      responses:
        '200':
          description: Webhook recibido correctamente por el cliente
  payment_session.payment_completed:
    post:
      operationId: paymentSessionPaymentCompleted
      tags:
        - Webhooks
      summary: Evento de pago exitoso
      description: >-
        Se produce cuando el pagador completa exitosamente el pago de una
        sesión, confirmándose la recepción de los fondos. Se enviará una
        notificación de este evento mediante un webhook cuando el pagador
        completa exitosamente el pago de una sesión
      parameters:
        - name: spidi-signature
          in: header
          required: true
          description: >-
            Firma HMAC-SHA256 para validar la autenticidad e integridad del
            mensaje.
          schema:
            type: string
            example: d9c8227652758252615617f6a8759526703902939d892376987f22387a672889
        - name: spidi-timestamp
          in: header
          required: true
          description: >-
            Timestamp ISO 8601 de la creación del evento para prevenir ataques
            de replay.
          schema:
            type: string
            format: date-time
            example: '2026-02-06T15:24:36.000Z'
        - name: idempotency-key
          in: header
          required: true
          description: >-
            UUID v4 único para garantizar que la operación se procese una sola
            vez.
          schema:
            type: string
            format: uuid
            example: 93465a7e-ea9b-41a8-8dca-14e811641c25
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - event
                - data
              properties:
                event:
                  type: string
                  enum:
                    - payment_session.paid
                  description: Tipo de evento de cobro exitoso.
                data:
                  type: object
                  required:
                    - session_payment
                    - payment_details
                  properties:
                    session_payment:
                      type: object
                      properties:
                        id:
                          type: string
                          nullable: false
                          description: >-
                            Identificador único de la sesión de pago, accedible
                            a través del payment_url.
                        origin:
                          type: string
                          nullable: false
                          enum:
                            - button
                            - request
                          description: >-
                            Origen de la sesión: 'button' (Botón de pago) o
                            'request' (Solicitud SPIDI).
                        agreement_id:
                          type: string
                          format: uuid
                          nullable: true
                          description: >-
                            Identificador único del acuerdo de liquidación. Debe
                            ser UUID v4.
                        currency_reference:
                          type: string
                          nullable: false
                          enum:
                            - USD
                            - EUR
                            - COP
                            - USDT
                            - VES
                          description: >-
                            Moneda de referencia que se fija para el pago. Usada
                            para calcular el monto en bolívares con la tasa
                            vigente.
                        amount_reference:
                          description: >-
                            Monto de referencia en la moneda especificada en
                            currencyReference con 2 decimales.
                          type: number
                          nullable: false
                          format: double
                          example: '100.001'
                        identifier_label:
                          type: string
                          nullable: true
                          description: >-
                            Etiqueta que indica cómo debe interpretarse el valor
                            enviado en identifier (ej. 'Nro de orden').
                        identifier:
                          type: string
                          nullable: false
                          description: >-
                            Identificador del pagador, interpretado según el
                            valor de identifier_label. Ejemplo: Nro de orden,
                            Nombre, etc.
                        description:
                          type: string
                          nullable: true
                          description: >-
                            Descripción del acuerdo o del concepto de pago
                            asociado a una sesión.
                          maxLength: 500
                        payment_method:
                          type: string
                          nullable: true
                          enum:
                            - crypto
                            - immediate_debit
                            - mobile_payment
                          description: 'Método de pago utilizado. Eco del request: no.'
                        spidi_transaction:
                          type: object
                          properties:
                            id:
                              description: ID de la transacción en SPIDI.
                              type: number
                              example: 1296
                            url:
                              type: string
                              nullable: true
                              format: uri
                              description: >-
                                URL del comprobante de pago en SPIDI (Comparar
                                con 'receipt_url').
                    crypto_details:
                      type: object
                      nullable: true
                      description: Detalles de pago con criptomonedas (null si no aplica).
                      properties:
                        provider_name:
                          type: string
                          nullable: true
                          description: >-
                            Nombre de la entidad o plataforma financiera que
                            custodia los activos del usuario. Representa el
                            ecosistema o 'banco digital' donde reside el saldo
                            original (ej. Binance, Crixto).
                          examples:
                            - Binance
                            - Crixto
                        crypto_order_id:
                          type: string
                          nullable: true
                          description: >-
                            Identificador de la orden cripto generada por el
                            proveedor.
                        payment_method_name:
                          type: string
                          description: >-
                            Nombre del método de pago (ej. Binance Pay, Crixto
                            Pay).
                          examples:
                            - Binance Pay
                            - Crixto Pay
                        amount_transaction_ves:
                          type: number
                          format: double
                          nullable: true
                          description: >-
                            Monto con 3 decimales de la transacción en la moneda
                            VES. Note que es el monto original sin incluir la
                            comisión por el pago.
                          example: 157.783
                        amount_pay_by_user_crypto:
                          type: number
                          format: double
                          nullable: true
                          description: >-
                            Monto con 3 decimales del pago realizado por el
                            usuario en la moneda cripto. Note que puede variar
                            del monto original si se aplica una comisión por el
                            pago.
                          example: 157.783
                        currency_crypto:
                          type: string
                          nullable: true
                          description: >-
                            Moneda cripto utilizada en el pago (por ejemplo,
                            USDT).
                          enum:
                            - USDT
                        exchange_rate:
                          type: number
                          format: double
                          description: >-
                            Tasa Cripto/Fiat usada durante la conversión de
                            cripto-fiat, especificada 4 decimales
                          example: 157.7837
                        paid_at:
                          type: string
                          nullable: true
                          format: date-time
                          description: >-
                            Fecha y hora en que se confirmó el pago cripto, en
                            formato ISO 8601.
                    payment_details:
                      type: object
                      nullable: true
                      description: >-
                        Detalles del pago bancario. Es 'null' si no aplica.
                        (Nota: Revisar si es objeto vacío o null). Eco del
                        request: no.
                      properties:
                        action_date:
                          type: string
                          format: date-time
                          nullable: true
                          description: >-
                            Fecha y hora de la acción del pagador, en formato
                            ISO 8601 con sufijo Z (UTC).
                        bank_name:
                          type: string
                          nullable: true
                          description: 'Nombre comercial del banco. Eco del request: no.'
                        bank_reference_id:
                          type: string
                          nullable: true
                          description: 'Referencia bancaria del pago. Eco del request: no.'
                        amount_ves:
                          type: number
                          description: Monto en bolívares con 2 decimales.
                          format: double
                        bcv_rate_usd_ves:
                          type: number
                          nullable: true
                          format: decimal(10,4)
                          description: >-
