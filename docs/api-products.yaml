  /api/v1/ext/payment-stops:
    get:
      summary: Listar Paradas
      description: >-
        Lista todas las paradas (stops) del comercio autenticado, con soporte de
        búsqueda y filtros (por estado, título, referencia interna) y
        paginación. Es útil para construir listados administrativos, buscadores
        y reportes.
      operationId: listStops
      tags:
        - Endpoints Parada
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          description: Filtra por estado de la parada
          required: false
          schema:
            type: string
            enum:
              - active
              - disabled
            example: active
        - name: q
          in: query
          description: Búsqueda por texto en stop_title y/o internal_reference (contiene)
          required: false
          schema:
            type: string
            example: caja
        - name: internal_reference
          in: query
          description: Filtra por coincidencia exacta de la referencia interna
          required: false
          schema:
            type: string
            example: caja_001
        - name: from_date
          in: query
          description: >-
            ISO 8601 (UTC). Devuelve paradas creadas desde esta fecha/hora
            (inclusive)
          required: false
          schema:
            type: string
            format: date-time
            example: '2025-01-01T00:00:00Z'
        - name: to_date
          in: query
          description: >-
            ISO 8601 (UTC). Devuelve paradas creadas hasta esta fecha/hora
            (inclusive)
          required: false
          schema:
            type: string
            format: date-time
            example: '2025-12-31T23:59:59Z'
        - name: limit
          in: query
          description: Máximo de elementos a devolver
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
            example: 20
        - name: offset
          in: query
          description: Desplazamiento para paginación
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
            example: 0
        - name: sort
          in: query
          description: Orden de los resultados
          required: false
          schema:
            type: string
            enum:
              - created_desc
              - created_asc
              - updated_desc
              - updated_asc
            default: created_desc
            example: created_desc
      responses:
        '200':
          description: Lista de paradas obtenida exitosamente
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - message
                  - data
                properties:
                  success:
                    type: boolean
                    description: True si el endpoint se procesó de forma exitosa
                    example: true
                  message:
                    type: string
                    description: Mensaje de confirmación legible para humanos
                    example: Payment stops retrieved successfully.
                  data:
                    type: object
                    required:
                      - total
                      - limit
                      - offset
                      - items
                    properties:
                      total:
                        type: integer
                        description: Total de paradas que cumplen con los filtros aplicados
                        example: 2
                      limit:
                        type: integer
                        description: Límite aplicado en esta página
                        example: 20
                      offset:
                        type: integer
                        description: Offset aplicado en esta página
                        example: 0
                      items:
                        type: array
                        description: Lista de paradas devueltas en esta página
                        items:
                          type: object
                          required:
                            - stop_id
                            - stop_url
                            - internal_reference
                            - stop_title
                            - status
                            - created_at
                            - updated_at
                            - links_active_count
                          properties:
                            stop_id:
                              type: string
                              nullable: false
                              format: uuid
                              description: >-
                                Identificador único de la Parada SPIDI en
                                formato UUID. Este ID identifica de forma
                                permanente el espacio donde el cliente puede
                                consultar y gestionar todas sus solicitudes de
                                pago.
                              example: stp_f9317c1b-8a4f-4d7e-9f25-3a2b8b9a4f12
                            stop_url:
                              type: string
                              nullable: true
                              format: uri
                              description: >-
                                URL permanente y única de la Parada SPIDI. El
                                cliente puede visitar esta URL en cualquier
                                momento para consultar y pagar todas sus
                                solicitudes de pago activas o históricas, sin
                                necesidad de recibir nuevos enlaces cada vez.
                              example: >-
                                https://mispidi.com/s/stp_f9317c1b-8a4f-4d7e-9f25-3a2b8b9a4f12
                            stop_title:
                              type: string
                              nullable: false
                              description: >-
                                Título visible de la Parada SPIDI mostrado al
                                cliente. Generalmente se usa el nombre del
                                cliente, contrato o servicio asociado.
                              example: Federico Díaz
                            internal_reference:
                              type: string
                              nullable: false
                              description: >-
                                Referencia interna única utilizada por el
