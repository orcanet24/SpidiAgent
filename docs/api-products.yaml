  /api/v1/ext/payment-stops/payment-sessions/batch:
    post:
      summary: Operar en Lote Enlaces de Paradas
      description: >-
        Ejecuta operaciones en lote para asociar/desasociar/reemplazar/limpiar
        sesiones de pago (`session_id`) visibles en una o varias Paradas
        (`stop_id`) en una sola llamada.


        **Operaciones soportadas:**

        - **add**: Agrega 1..N `session_id` como activos (si ya estaban, es
        no-op y se reportan en `already_present`)

        - **remove**: Desasocia 1..N `session_id` activos (si no estaban
        activos, se reportan en `not_active` o `not_found`)

        - **replace**: Sustituye atómicamente el conjunto activo por
        `session_ids`. Con lista vacía `clear`

        - **clear**: Elimina todos los activos (la Parada puede quedar en estado
        Empty)


        **Características:**

        - Idempotente mediante encabezado `Idempotency-Key` (TTL: 24 horas)

        - Cada ítem se procesa de forma independiente

        - El resultado se devuelve por Parada

        - Rate limit: 100 requests/minuto por comercio


        **Notas importantes:**

        - Solo sesiones `pending` pueden activarse (`add`/`replace`). Las
        sesiones `paid`/`expired` pasan a histórico automáticamente

        - `replace` con lista vacía equivale a `clear` (limpieza atómica)

        - Usa siempre `Idempotency-Key` en operaciones en lote

        - Máximo 100 items por batch
      operationId: batchOperateStopPaymentSessions
      tags:
        - Endpoints Publicar
      security:
        - bearerAuth: []
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - continue_on_error
                - items
              properties:
                continue_on_error:
                  type: boolean
                  nullable: true
                  default: false
                  description: >-
                    Indica si el procesamiento debe continuar con el resto de
                    los ítems aunque alguno falle en operaciones de batch.

                    - Si es `false`, se detiene en el primer error y las
                    operaciones ya exitosas permanecen válidas. 

                    - Si es `true`, continúa procesando hasta el final y luego
                    reporta las fallas acumuladas.
                  example: true
                items:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required:
                      - stop_id
                      - op
                    properties:
                      stop_id:
                        type: string
                        description: >-
                          Identificador de la Parada sobre la que se ejecuta la
                          operación. Debe pertenecer al comercio autenticado.
                        example: stp_111
                      op:
                        type: string
                        enum:
                          - add
                          - remove
                          - replace
                          - clear
                        description: >-
                          Operación a ejecutar: **add** (agregar sesiones),
                          **remove** (desasociar sesiones), **replace**
                          (reemplazar conjunto activo), **clear** (limpiar todos
                          los activos)
                        example: add
                      session_ids:
                        type: array
                        items:
                          type: string
                        description: >-
                          IDs de sesiones involucradas. Requerido para
                          operaciones add, remove y replace. Solo sesiones en
                          estado **pending** pueden activarse (add/replace).
                        example:
                          - sess_A
                          - sess_B
                  description: >-
                    Lista de operaciones por Parada. Debe contener al menos 1
                    ítem.
                  example:
                    - stop_id: stp_111
                      op: add
                      session_ids:
                        - sess_A
                        - sess_B
                    - stop_id: stp_222
                      op: remove
                      session_ids:
                        - sess_C
                    - stop_id: stp_333
                      op: replace
                      session_ids:
                        - sess_D
                    - stop_id: stp_444
                      op: clear
            examples:
              mixed_operations:
                summary: Operaciones mixtas en múltiples paradas
                value:
                  continue_on_error: true
                  items:
                    - stop_id: stp_111
                      op: add
                      session_ids:
                        - sess_A
                        - sess_B
                    - stop_id: stp_222
                      op: remove
                      session_ids:
                        - sess_C
                    - stop_id: stp_333
                      op: replace
                      session_ids:
                        - sess_D
                    - stop_id: stp_444
                      op: clear
