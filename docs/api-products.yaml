                        payment_method:
                          type: string
                          nullable: true
                          enum:
                            - crypto
                            - immediate_debit
                            - mobile_payment
                          description: 'Método de pago utilizado. Eco del request: no.'
                    credit:
                      type: object
                      description: Detalle del crédito que falló.
                      allOf:
                        - type: object
                          properties:
                            id:
                              type: string
                            amount_ves_credited:
                              type: number
                              nullable: true
                              description: >-
                                Monto neto acreditado al receptor en bolívares,
                                luego de aplicar las comisiones
                                correspondientes. Siempre tiene 2 decimales.
                              format: double
                              example: '100.01'
                            bank_commissions_ves:
                              type: number
                              nullable: true
                              format: decimal(12,2)
                              description: >-
                                Comisión bancaria total cobrada en bolívares
                                para la liquidación. Eco del request: no.
                            receive_date:
                              type: string
                              format: date-time
                              nullable: true
                              description: >-
