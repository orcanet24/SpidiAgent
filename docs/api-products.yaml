    post:
      summary: Crear Parada(s)
      description: >-
        Crea una o múltiples Paradas SPIDI en un mismo request.


        ## ¿Qué son las Paradas SPIDI?


        Las Paradas SPIDI son espacios únicos y permanentes asociados a cada
        cliente, donde este puede consultar, gestionar y pagar todas sus
        solicitudes de pago activas o históricas, sin necesidad de recibir
        nuevos solicitudes de pago cada vez.


        Funcionan como un punto de acceso trazable y constante, ideal para
        relaciones comerciales continuas, suscripciones o pagos recurrentes,
        simplificando la experiencia tanto para el pagador como para la empresa.


        ## Características principales


        - **URL permanente**: Cada parada posee una `stop_url` única que el
        cliente puede visitar en cualquier momento

        - **Gestión centralizada**: Desde esa URL, el cliente ve todas sus
        solicitudes de pago (pendientes, vencidas o completadas)

        - **Creación masiva**: Permite crear de 1 a N paradas en un solo
        request, ideal para procesos de onboarding inicial

        - **Idempotencia**: Soporta reintentos idempotentes mediante
        `Idempotency-Key`

        - **Asociación flexible**: Puede vincularse a un cliente específico o a
        múltiples referencias según las necesidades de tu plataforma


        ## Estados de una Parada


        - **Active**: Existe al menos un enlace de pago activo; se muestran los
        pagos disponibles

        - **Empty**: Sin solicitudes de pago activas; muestra el mensaje
        configurado en `empty_state_message`

        - **Disabled**: Deshabilitada temporalmente, pero puede reactivarse

        - **Deleted**: Eliminada definitivamente


        ## Integración técnica


        Se recomienda definir y mantener un campo `internal_reference` para cada
        recurso (cliente, contrato o factura), que servirá para conciliar y
        auditar operaciones entre tu sistema y SPIDI, y asociar solicitudes de
        pago con su Parada correspondiente.
      operationId: createStops
      tags:
        - Endpoints Parada
      security:
        - bearerAuth: []
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - continue_on_error
                - spidi_id
                - items
              properties:
                spidi_id:
                  type: string
                  nullable: false
                  description: Identificador único de tipo UUID para el usuario SPIDI
                  example: a966ce0d-3af3-415d-ba86-1db5a1c21cf0
                continue_on_error:
                  type: boolean
                  nullable: true
                  default: false
                  description: >-
                    Indica si el procesamiento debe continuar con el resto de
                    los ítems aunque alguno falle en operaciones de batch.

                    - Si es `false`, se detiene en el primer error y las
                    operaciones ya exitosas permanecen válidas. 

                    - Si es `true`, continúa procesando hasta el final y luego
                    reporta las fallas acumuladas.
                  example: true
                items:
                  type: array
                  description: Listado de paradas a crear (mínimo 1 ítem)
                  minItems: 1
                  items:
                    type: object
                    required:
                      - stop_title
                      - internal_reference
                    properties:
                      stop_title:
                        type: string
                        nullable: false
                        description: >-
                          Título visible de la Parada SPIDI mostrado al cliente.
                          Generalmente se usa el nombre del cliente, contrato o
                          servicio asociado.
                        example: Federico Díaz
                      internal_reference:
                        type: string
                        nullable: false
                        description: >-
                          Referencia interna única utilizada por el sistema o el
                          comercio para identificar la solicitud de pago o
                          parada (propósito estrictamente técnico,no visible al
                          usuario final).


                          **Importancia para Paradas SPIDI:**

                          - Permite conciliar y auditar operaciones entre tu
                          sistema y SPIDI

                          - Sirve para asociar solicitudes de pago con su Parada
                          correspondiente

                          - Puede vincularse a clientes, contratos o facturas en
                          tu plataforma


                          Se recomienda mantener este campo de forma consistente
                          para facilitar la trazabilidad.
                        example: '8233232'
                      empty_state_message:
                        type: string
                        nullable: true
                        description: >-
                          Mensaje personalizado mostrado al cliente cuando la
                          Parada no tiene solicitudes de pago activas (estado
                          Empty). Ejemplo: 'No tienes pagos pendientes' o
                          'Actualmente no hay deudas asociadas'.
                        example: No tienes pagos pendientes
                      status:
                        type: string
                        enum:
                          - active
                          - disabled
                        description: Estado inicial de la parada
                        default: active
                        example: active
            examples:
              single:
                summary: Crear una sola parada
                value:
                  continue_on_error: false
                  spidi_id: 88eab2b9-739e-11f0-9e3f-42010a1ce014
                  items:
                    - internal_reference: '8233232'
                      stop_title: Federico Díaz
                      empty_state_message: No tienes pagos pendientes
                      status: active
              batch:
                summary: Crear múltiples paradas
