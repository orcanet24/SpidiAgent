              next_cursor: null
              total_estimate: 2
              items: []
            - stop_id: stp_333
              error:
                code: not_found
                message: Stop not found.
    payment_method:
      type: string
      nullable: true
      enum:
        - crypto
        - immediate_debit
        - mobile_payment
      description: 'Método de pago utilizado. Eco del request: no.'
    transactionSpidi_id:
      description: ID de la transacción en SPIDI.
      type: number
      example: 1296
    transactionSpidi_url:
      type: string
      nullable: true
      format: uri
      description: URL del comprobante de pago en SPIDI (Comparar con 'receipt_url').
    sessionPaymentWebhook:
      type: object
      properties:
        id:
          type: string
          nullable: false
          description: >-
            Identificador único de la sesión de pago, accedible a través del
            payment_url.
        origin:
          type: string
          nullable: false
          enum:
            - button
            - request
          description: >-
            Origen de la sesión: 'button' (Botón de pago) o 'request' (Solicitud
            SPIDI).
        agreement_id:
          type: string
          format: uuid
          nullable: true
          description: Identificador único del acuerdo de liquidación. Debe ser UUID v4.
        currency_reference:
          type: string
          nullable: false
          enum:
            - USD
            - EUR
            - COP
            - USDT
            - VES
          description: >-
            Moneda de referencia que se fija para el pago. Usada para calcular
            el monto en bolívares con la tasa vigente.
        amount_reference:
          description: >-
            Monto de referencia en la moneda especificada en currencyReference
            con 2 decimales.
          type: number
          nullable: false
          format: double
          example: '100.001'
        identifier_label:
          type: string
          nullable: true
          description: >-
            Etiqueta que indica cómo debe interpretarse el valor enviado en
            identifier (ej. 'Nro de orden').
        identifier:
          type: string
          nullable: false
          description: >-
            Identificador del pagador, interpretado según el valor de
            identifier_label. Ejemplo: Nro de orden, Nombre, etc.
        description:
          type: string
          nullable: true
          description: >-
            Descripción del acuerdo o del concepto de pago asociado a una
            sesión.
          maxLength: 500
        payment_method:
          type: string
          nullable: true
          enum:
            - crypto
            - immediate_debit
            - mobile_payment
          description: 'Método de pago utilizado. Eco del request: no.'
    recipientType:
      type: string
      nullable: true
      description: Tipo del receptor del crédito.
      enum:
        - owner
        - partner
    partner_observations:
      type: string
      nullable: false
      maxLength: 500
      description: >-
        Mensaje libre para el partner (máx. 500 caracteres). (Requerido en
        distribution, Eco del request: sí)
    recipient:
      type: object
      properties:
        id:
          type: string
          nullable: true
          description: Identificador del receptor del crédito.
        type:
          type: string
          nullable: true
          description: Tipo del receptor del crédito.
          enum:
            - owner
            - partner
        split_recipient_agreement_id:
          type: string
          nullable: false
          format: uuid
          description: >-
            UUID global SPIDI del agreement de recepción. Este ID se usará en
            acuerdos de distribución para identificar al receptor del split.
            (Requerido en distribution)
        partner:
          type: object
          properties:
            observations:
              type: string
              nullable: false
              maxLength: 500
              description: >-
                Mensaje libre para el partner (máx. 500 caracteres). (Requerido
                en distribution, Eco del request: sí)
            name:
              type: string
              nullable: true
              description: Nombre o razón social del partner
            rif_number:
              type: string
              nullable: true
              description: RIF del partner
    creditWebhook:
      type: object
      properties:
        id:
          type: string
        amount_ves_credited:
          type: number
          nullable: true
          description: >-
            Monto neto acreditado al receptor en bolívares, luego de aplicar las
            comisiones correspondientes. Siempre tiene 2 decimales.
          format: double
          example: '100.01'
        bank_commissions_ves:
          type: number
          nullable: true
          format: decimal(12,2)
          description: >-
            Comisión bancaria total cobrada en bolívares para la liquidación.
            Eco del request: no.
        receive_date:
          type: string
          format: date-time
          nullable: true
          description: Fecha y hora en que se acreditó el pago (ISO 8601).
        bank_name:
          type: string
          nullable: true
          description: 'Nombre comercial del banco. Eco del request: no.'
        bank_reference_id:
          type: string
          nullable: true
          description: 'Referencia bancaria del pago. Eco del request: no.'
        recipient:
          type: object
          properties:
            id:
              type: string
              nullable: true
              description: Identificador del receptor del crédito.
            type:
              type: string
              nullable: true
              description: Tipo del receptor del crédito.
              enum:
                - owner
                - partner
            split_recipient_agreement_id:
              type: string
              nullable: false
              format: uuid
              description: >-
                UUID global SPIDI del agreement de recepción. Este ID se usará
                en acuerdos de distribución para identificar al receptor del
                split. (Requerido en distribution)
            partner:
              type: object
              properties:
                observations:
                  type: string
                  nullable: false
                  maxLength: 500
                  description: >-
                    Mensaje libre para el partner (máx. 500 caracteres).
                    (Requerido en distribution, Eco del request: sí)
                name:
                  type: string
                  nullable: true
                  description: Nombre o razón social del partner
                rif_number:
                  type: string
                  nullable: true
                  description: RIF del partner
  parameters:
    spidiSignature:
      name: spidi-signature
      in: header
      required: true
      description: Firma HMAC-SHA256 para validar la autenticidad e integridad del mensaje.
      schema:
        type: string
        example: d9c8227652758252615617f6a8759526703902939d892376987f22387a672889
    spidiTimestamp:
      name: spidi-timestamp
      in: header
      required: true
      description: >-
        Timestamp ISO 8601 de la creación del evento para prevenir ataques de
        replay.
      schema:
        type: string
        format: date-time
        example: '2026-02-06T15:24:36.000Z'
    idempotencyKey:
      name: idempotency-key
      in: header
      required: true
      description: UUID v4 único para garantizar que la operación se procese una sola vez.
      schema:
        type: string
        format: uuid
        example: 93465a7e-ea9b-41a8-8dca-14e811641c25
