  /api/v1/ext/partner:
    post:
      tags:
        - Endpoints Especiales
      summary: Generar Partner
      description: Endpoint para la creación de un nuevo partner en el sistema.
      operationId: createPartner
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - identification
                - contact_email
                - contact_phone
                - bank_code
                - payment_phone_or_cnta
                - user_type
              properties:
                name:
                  type: string
                  nullable: true
                  description: Nombre o razón social del partner
                identification:
                  type: string
                  nullable: true
                  description: RIF del partner
                contact_email:
                  type: string
                  format: email
                  description: Correo electrónico del partner.
                contact_phone:
                  type: string
                  description: Teléfono del partner.
                bank_code:
                  type: string
                  nullable: false
                  description: >-
                    Código del banco. Solo acepta 3–4 dígitos (p.ej., 105 o
                    0137).
                payment_phone_or_cnta:
                  type: string
                  description: Teléfono o número de cuenta para el pago.
                user_type:
                  type: string
                  description: Tipo de usuario.
                  enum:
                    - personal
                    - comercial
      responses:
        '201':
          description: Partner creado exitosamente.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    nullable: false
                    description: >-
                      Indica si la operación fue exitosa. True si el endpoint se
                      procesó de forma exitosa. False de lo contrario
                    example: true
                  message:
                    type: string
                    nullable: true
                    description: Mensaje de confirmación o error legible.
                  data:
                    type: object
                    properties:
                      partner_id:
                        type: string
                        format: uuid
                        description: Identificador único del partner.
                      short_name:
                        type: string
                        description: >-
                          Nombre corto del partner. Se genera automáticamente a
                          partir del owner que lo crea seguido de p1 p2 p3 etc
                      name:
                        type: string
                        nullable: true
                        description: Nombre o razón social del partner
                      identification:
                        type: string
                        nullable: true
                        description: RIF del partner
                      email:
                        type: string
                        format: email
                        description: Correo electrónico del partner.
                      phone:
                        type: string
                        description: Teléfono del partner.
                      user_type:
                        type: string
                        description: Tipo de usuario.
                        enum:
                          - personal
                          - comercial
                      bank_account_id:
                        type: string
                        format: uuid
                        description: >-
                          Identificador único de la cuenta bancaria en nuestros
                          sistemas.
                      split_recipient_agreement_id:
                        type: string
                        nullable: false
                        format: uuid
                        description: >-
                          UUID global SPIDI del agreement de recepción. Este ID
                          se usará en acuerdos de distribución para identificar
                          al receptor del split. (Requerido en distribution)
              example:
                success: true
                message: Partner created successfully
                data:
                  partner_id: cc3014e7-f7ea-427d-8f2f-f38592786e58
                  short_name: miempresa_p2
                  name: Mi Empresa
                  identification: J123456789
                  email: mi empresa
                  phone: '04992362571'
                  user_type: comercial
                  bank_account_id: 22086f69-076e-4592-a06c-33995afd7bba
                  split_recipient_agreement_id: rcv_859f0e4f694f5f5a
  /api/v1/ext/payment-sessions/buttons:
    post:
      summary: Crear Sesión
      description: >-
        Permite crear una **sesión de pago** a través del botón de pago de
        SPIDI.Incluye el `agreement_id` para determinar las reglas de
        **liquidación** y **split**.
      operationId: createPaymentSessionButton
      tags:
        - Endpoints Botón
      security:
        - bearerAuth: []
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - agreement_id
                - amount_reference
                - currency_reference
                - identifier_label
                - identifier
                - description
                - success_url
                - failure_url
              properties:
                agreement_id:
                  type: string
                  format: uuid
                  nullable: true
                  description: >-
                    Identificador único del acuerdo de liquidación. Debe ser
                    UUID v4.
                amount_reference:
                  description: >-
                    Monto de referencia en la moneda especificada en
                    currencyReference con 2 decimales.
                  type: number
                  nullable: false
                  format: double
                  example: '100.001'
                currency_reference:
                  type: string
                  nullable: false
                  enum:
                    - USD
                    - EUR
                    - COP
                    - USDT
                    - VES
                  description: >-
                    Moneda de referencia que se fija para el pago. Usada para
                    calcular el monto en bolívares con la tasa vigente.
                identifier_label:
                  type: string
                  nullable: true
                  description: >-
                    Etiqueta que indica cómo debe interpretarse el valor enviado
                    en identifier (ej. 'Nro de orden').
                identifier:
                  type: string
                  nullable: false
                  description: >-
                    Identificador del pagador, interpretado según el valor de
                    identifier_label. Ejemplo: Nro de orden, Nombre, etc.
                description:
                  type: string
                  nullable: true
                  description: >-
                    Descripción del acuerdo o del concepto de pago asociado a
                    una sesión.
                  maxLength: 500
                success_url:
                  type: string
                  nullable: true
                  format: uri
                  description: >-
                    URL de redirección que se utiliza cuando un intento de pago
                    es exitoso.
                  pattern: ^[a-z1-9]+://[^\s]*$
                failure_url:
                  type: string
                  nullable: true
                  format: uri
                  description: >-
                    URL de redirección que se utiliza cuando un intento de pago
                    falle.
                  pattern: ^[a-z1-9]+://[^\s]*$
                webhook_url:
                  type: string
                  nullable: true
                  format: uri
                  description: URL para recibir notificaciones de webhook.
                split:
                  type: object
                  nullable: true
                  description: >-
                    Configuración de división de pagos (Request) / Eco del
                    request del split (Response).
                  properties:
                    document:
                      type: object
                      nullable: true
                      description: >-
                        Información del documento proporcionado por el owner a
                        los partners para dejar evidencia del split.


                        **Notas importantes:**

                        - Esta información **no implica cálculo fiscal** por
                        parte de SPIDI; es solo comunicación entre owner y
                        partners.

                        - `splitDocument_url` puede ser público con hash o una
                        URL autenticada.

                        - SPIDI **no interpreta ni calcula IVA** a partir de
                        esta información; solo lo transporta.
                      properties:
                        name:
                          type: string
                          nullable: true
                          description: >-
                            Nombre del documento asociado a la transacción split
                            (por ejemplo: factura/recibo/contrato
                            D001-00045678).
                        type:
                          type: string
                          nullable: true
                          description: >-
                            Formato libre del owner donde especifica el tipo de
                            documento.
                          examples:
                            - Factura
                            - Contrato
                            - Recibo
                        date:
                          type: string
                          nullable: true
                          format: date
                          description: >-
                            Fecha de emisión del documento en formato ISO 8601
                            (YYYY-MM-DD).
                        url:
                          type: string
                          nullable: true
                          format: uri
                          description: >-
                            Enlace para visualizar/descargar el documento del
                            split. Puede ser público con hash o una URL
                            autenticada.
                        observations:
                          type: string
                          nullable: true
                          maxLength: 500
                          description: >-
                            Observaciones libres del owner (máx. 500
                            caracteres).
                    distribution:
                      type: array
                      nullable: false
                      description: >-
                        Lista de reglas/destinatarios del split. Debe tener ≥ 1
                        ítem. La suma de amount_reference debe ser menor al
                        amount total de la sesión, porque la diferencia restante
                        se asigna automáticamente al owner, quien siempre debe
                        recibir una parte del pago. (Requerido cuando
                        split=true)
                      items:
                        type: object
                        required:
                          - split_recipient_agreement_id
                          - amount_reference
                          - observations
                        properties:
                          split_recipient_agreement_id:
                            type: string
                            nullable: false
                            format: uuid
                            description: >-
                              UUID global SPIDI del agreement de recepción. Este
                              ID se usará en acuerdos de distribución para
                              identificar al receptor del split. (Requerido en
                              distribution)
                          label:
                            type: string
                            nullable: true
                            description: >-
                              Etiqueta descriptiva del receptor en un split.
                              (Opcional en distribution, Eco del request: sí)
                          amount_reference:
                            description: >-
                              Monto de referencia en la moneda especificada en
                              currencyReference con 2 decimales.
                            type: number
                            nullable: false
                            format: double
                            example: '100.001'
                          observations:
                            type: string
                            nullable: false
                            maxLength: 500
                            description: >-
                              Mensaje libre para el partner (máx. 500
                              caracteres). (Requerido en distribution, Eco del
                              request: sí)
                config:
                  type: array
                  description: >-
                    Configuración dinámica opcional para personalizar la
                    experiencia comercial del botón de pago.
                  items:
                    type: object
                    properties:
                      type:
                        type: string
                        description: >-
                          Identificador de la configuración a aplicar. Por
                          ejemplo, 'initial_currency' sirve para priorizar qué
                          método de pago (fiat o cripto) se muestra por defecto
                          al usuario.
                      value:
                        description: >-
                          Valor asociado a la configuración. Para
                          'initial_currency', debe seguir el estándar ISO 4217
                          para monedas fiduciarias o 'CRYPTO' para activos
                          digitales.
                        enum:
                          - VES
                          - CRYPTO
                    required:
                      - type
                      - value
                    example:
                      type: initial_currency
                      value: CRYPTO
                duration_minutes:
                  type: integer
                  nullable: true
                  description: Duración en minutos de la sesión.
                  minimum: 5
                  maximum: 20
                  example: 5
            examples:
              Sin Split:
                summary: Sesión sin Split con duración de 5 minutos
                value:
                  agreement_id: '2432434'
                  amount_reference: 50
                  currency_reference: USD
                  identifier_label: Nombre del cliente
                  identifier: Juan Pérez
                  description: Pago de membresía
                  success_url: https://miapp.com/pago-exitoso
                  failure_url: https://miapp.com/pago-fallido
                  webhook_url: https://miapi.com/spidi/webhook
                  duration_minutes: 5
              Con Split:
                summary: Sesión con Split
                value:
                  currency_reference: USD
                  amount_reference: 30
                  agreement_id: stl_session_01
                  identifier_label: Nombre del cliente
                  identifier: Juan Pérez
                  description: Pago de servicio de internet
                  success_url: miapp://pago/exitoso
                  failure_url: miapp://pago/fallido
                  webhook_url: https://miapi.com/spidi/webhook
                  split:
                    document:
                      document_name: D001-00045678
                      document_type: Factura
                      document_date: '2025-10-20'
                      document_url: https://owner.com/document/D001-00045678
                      document_observations: any observation to owner
                    distribution:
                      - split_recipient_agreement_id: rcv_014…723c1a2
                        label: Partner 1
                        amount_reference: 10
                        observations: any observation to communicate to Partner 1
                      - split_recipient_agreement_id: rcv_016…112dde3
                        label: Partner 2
                        amount_reference: 20
                        observations: any observation to communicate to Partner 2
              Priorización Cripto:
                summary: Sesión con Priorización de Interfaz (Cripto)
                value:
                  agreement_id: '2432434'
                  amount_reference: 50
                  currency_reference: USD
                  identifier_label: Nombre del cliente
                  identifier: Juan Pérez
                  description: Pago con preferencia en activos digitales
                  success_url: https://miapp.com/pago-exitoso
                  failure_url: https://miapp.com/pago-fallido
                  webhook_url: https://miapi.com/spidi/webhook
                  config:
                    - type: initial_currency
                      value: CRYPTO
      responses:
        '200':
          description: Sesión de pago creada exitosamente
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - message
                  - data
                properties:
                  success:
                    type: boolean
                    nullable: false
                    description: >-
                      Indica si la operación fue exitosa. True si el endpoint se
                      procesó de forma exitosa. False de lo contrario
                    example: true
                  message:
                    type: string
                    example: Payment session created successfully.
                    description: Mensaje de confirmación de la creación.
                  data:
                    type: object
                    required:
                      - session_id
                      - session_origin
                      - payment_url
                      - currency_reference
                      - amount_reference
                      - identifier_label
                      - identifier
                      - description
                      - success_url
                      - failure_url
                      - created_at
                    properties:
                      session_id:
                        type: string
                        nullable: false
                        description: >-
                          Identificador único de la sesión de pago, accedible a
                          través del payment_url.
                      session_origin:
                        type: string
                        nullable: false
                        enum:
                          - button
                          - request
                        description: >-
                          Origen de la sesión: 'button' (Botón de pago) o
                          'request' (Solicitud SPIDI).
                      payment_url:
                        type: string
                        nullable: true
                        description: >-
                          URL de la página segura SPIDI donde quien paga realiza
                          el pago.
                        example: '{{base_url}}/?id=3ddc4cfb-c09a-43de-92c1-e4a069732e90'
                      currency_reference:
