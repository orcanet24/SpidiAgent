              op: add
              session_ids:
                - sess_A
                - sess_B
            - stop_id: stp_222
              op: remove
              session_ids:
                - sess_C
            - stop_id: stp_333
              op: replace
              session_ids:
                - sess_D
            - stop_id: stp_444
              op: clear
