  /api/v1/ext/payment-stops/payment-sessions/reorder:
    patch:
      summary: Reordenar Sesiones en Paradas
      description: >-
        Define el orden de visualización de los solicitudes de pago activas
        (derivados de sesiones `session_id`) dentro de una o varias Paradas
        (`stop_id`) en una sola llamada.


        **Características:**

        - No agrega ni quita sesiones; **solo** cambia el **orden**

        - Idempotente mediante `Idempotency-Key` (TTL: 24 horas)

        - Control de concurrencia opcional mediante `order_version`
        (recomendado)

        - Rate limit: 100 requests/minuto por comercio


        **Modos de operación:**

        - **append** (default): reordena las sesiones listadas arriba y
        cualquier activa no listada queda al final manteniendo su orden relativo
        actual

        - **strict**: la lista debe representar exactamente el conjunto de
        activos; si falta alguna activa o sobra alguna no activa, se devuelve
        error por ítem


        **Notas importantes:**

        - Separación de responsabilidades: usa `reorder` solo para ordenar. Para
        agregar/quitar/sustituir, utiliza el batch de operar solicitudes de pago

        - Idempotencia siempre: envía `Idempotency-Key`; misma clave + mismo
        payload misma respuesta

        - Máximo 100 items por batch
      operationId: reorderStopPaymentSessions
      tags:
        - Endpoints Publicar
      security:
        - bearerAuth: []
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - continue_on_error
                - items
              properties:
                continue_on_error:
                  type: boolean
                  nullable: true
                  default: false
                  description: >-
                    Indica si el procesamiento debe continuar con el resto de
                    los ítems aunque alguno falle en operaciones de batch.

                    - Si es `false`, se detiene en el primer error y las
                    operaciones ya exitosas permanecen válidas. 

                    - Si es `true`, continúa procesando hasta el final y luego
                    reporta las fallas acumuladas.
                  example: true
                items:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required:
                      - stop_id
                      - session_ids
                    properties:
                      stop_id:
                        type: string
                        nullable: false
                        format: uuid
                        description: >-
                          Identificador único de la Parada SPIDI en formato
                          UUID. Este ID identifica de forma permanente el
                          espacio donde el cliente puede consultar y gestionar
                          todas sus solicitudes de pago.
                        example: stp_f9317c1b-8a4f-4d7e-9f25-3a2b8b9a4f12
                      session_ids:
                        type: array
                        minItems: 1
                        items:
                          type: string
                        description: >-
                          Nuevo orden deseado. Deben ser `session_id`
                          **activos** en esa Parada (ver `mode`)
                      mode:
                        type: string
                        nullable: true
                        default: append
                        enum:
                          - append
                          - strict
                        description: >-
                          Modo de reordenamiento: 'append' (por defecto) o
                          'strict' (reemplazar lista).
                  description: >-
                    Lista de instrucciones de reorden por Parada. Al menos 1
                    ítem
                  example:
                    - stop_id: stp_111
                      session_ids:
                        - sess_B
                        - sess_A
                        - sess_C
                      mode: append
                    - stop_id: stp_222
                      session_ids:
                        - sess_X
                        - sess_Y
                      mode: strict
            examples:
              mixed_modes:
                summary: Reordenamiento con modos mixtos
                value:
                  continue_on_error: true
                  items:
                    - stop_id: stp_111
                      session_ids:
                        - sess_B
                        - sess_A
                        - sess_C
                      mode: append
                    - stop_id: stp_222
                      session_ids:
                        - sess_X
                        - sess_Y
                      mode: strict
