      description: >-
        Elimina definitivamente una Parada SPIDI.


        ** Importante:**

        - La eliminación es **permanente** y no se puede revertir

        - **No se permite eliminar** una parada que tenga solicitudes de pago
        activas asociadas; primero debes removerlos o expirarlos

        - La operación es **idempotente**: múltiples llamadas con la misma
        `Idempotency-Key` no crearán duplicados


        ** Recomendación:** En lugar de eliminar, considera deshabilitar la
        parada usando el endpoint PATCH con `status: "disabled"`. Esto permite
        reactivarla en el futuro si es necesario.
