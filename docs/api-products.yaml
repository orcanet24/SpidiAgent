    cancellation_category:
      type: string
      enum:
        - INCORRECT_DATA
        - ALTERNATIVE_PAYMENT_RECEIVED
        - OTHER
      description: >-
        **Clasificación técnica obligatoria.** Permite segmentar el motivo de
        cancelación para análisis de conversión y auditoría. 


        **Definiciones:**

        * `INCORRECT_DATA`: Datos de pago o cliente inválidos (ej. CI/RIF
        erróneo).

        * `ALTERNATIVE_PAYMENT_RECEIVED`: El cliente pagó por otra vía (ej.
        efectivo o transferencia directa).

        * `OTHER`: Motivos no clasificados previamente (requiere nota
        adicional).
      example: INCORRECT_DATA
