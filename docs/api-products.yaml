openapi: 3.1.0
info:
  title: API Products
  version: 1.0.0
  description: >-
    API para integraciones con SPIDI.

     ## Navegación en Móvil

    Si estás en un dispositivo móvil, recuerda usar el menú de hamburguesa en la
    esquina superior izquierda para ver todos los endpoints disponibles.


    ## Entornos


    Para información detallada sobre entornos (Sandbox y Producción), consulta
    la página dedicada:

     **[Entornos](../../env)**

    ## Webhooks


    SPIDI utiliza webhooks para notificar en tiempo real sobre eventos
    importantes (pagos completados, sesiones expiradas, etc.). Para información
    completa sobre:


    - Eventos disponibles

    - Estructura de webhooks

    - Reintentos automáticos

    - Seguridad y validación

    - Ejemplos de implementación


    Consulta la página dedicada:

     **[Webhooks](../../concepts/webhooks.mdx)**
servers:
  - url: https://sandbox.api.spidipagos.com
    description: Sandbox - Entorno de pruebas para desarrollo e integración
tags:
  - name: Endpoints Comunes
    description: Endpoints que siempre se deben utilizar
  - name: Endpoints Botón
    description: Endpoints relacionados con los botones de pago
  - name: Endpoints Solicitud
    description: Endpoints relacionados con las solicitudes de pago
  - name: Endpoints Parada
    description: >-
      Endpoints para gestionar Paradas SPIDI.


      ## ¿Qué son las Paradas SPIDI?


      Las Paradas SPIDI son espacios únicos y permanentes asociados a cada
      cliente, donde este puede consultar, gestionar y pagar todas sus
      solicitudes de pago activas o históricas, sin necesidad de recibir nuevos
      enlaces cada vez.


      **Beneficios clave:**

      - **URL permanente**: Punto de acceso constante y trazable

      - **Gestión centralizada**: Todas las solicitudes de pago en un solo lugar

      - **Ideal para**: Relaciones comerciales continuas, suscripciones, pagos
      recurrentes

      - **Experiencia simplificada**: Para el pagador y la empresa


      **Estados de una Parada:**

      - **Active**: Con solicitudes de pago activas disponibles

      - **Empty**: Sin solicitudes de pago activas, muestra mensaje
      personalizado

      - **Disabled**: Deshabilitada temporalmente, puede reactivarse

      - **Deleted**: Eliminada definitivamente
  - name: Endpoints Publicar
    description: Endpoints relacionados con la publicacion de solicitudes en las paradas
  - name: Endpoints Especiales
    description: Endpoints especiales
  - name: Endpoints Legacy
    description: >-
      Endpoints de versiones anteriores de la API que se mantienen por
      compatibilidad.
paths:
  /api/spidipagos/login:
    post:
      summary: Login
      description: >-
        Permite autenticar un usuario en el sistema SPIDI utilizando
        credenciales de acceso. Este endpoint es fundamental para obtener el
        token de autorización necesario para realizar operaciones posteriores en
        la API.


        ### Funcionalidades principales:


        * **Autenticación segura:** Valida las credenciales del usuario
        (`short_name` y `password`).

        * **Generación de token JWT:** Retorna un token de acceso que debe
        utilizarse en requests posteriores.

        * **Control de sesión:** El token tiene un tiempo de expiración definido
        para mayor seguridad.


        ### Casos de uso típicos:


        * Inicio de sesión de usuarios comercio.

        * Obtención de token para operaciones API.

        * Renovación de credenciales de acceso.

        * Autenticación en aplicaciones integradas.


        Una vez autenticado exitosamente, el token JWT debe incluirse en el
        header `Authorization: Bearer {token}` de todas las requests posteriores
        a la API.
      operationId: login
      tags:
        - Endpoints Comunes
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - short_name
                - password
              properties:
                short_name:
                  type: string
                  nullable: false
                  description: Nombre de usuario o identificador único del comercio.
                password:
                  type: string
                  nullable: false
                  description: Contraseña de acceso del usuario.
            example:
              short_name: spidiusuario1
              password: clavesecreta
      responses:
        '200':
          description: Autenticación exitosa
          content:
            application/json:
              schema:
                type: object
                required:
                  - token
                properties:
                  token:
                    type: string
                    nullable: false
                    description: >-
                      Token de autorización **JWT** para autenticar requests
                      posteriores. 


                      * El token es un **JWT (JSON Web Token)** codificado en
                      Base64.

                      * Debe incluirse en el header `Authorization: Bearer
                      {token}` de requests posteriores.

                      * Tiene un tiempo de expiración definido por seguridad.

                      * Contiene información del usuario autenticado y permisos.
              example:
                token: >-
                  eyJhbGciOiJlUzI1NilsInR5cCI6IkpXVCJ9.eyJzaG9ydF9uYW1lljoiZGInaXRlbClslmlhdCI6MTc2MDY0NTU4OCwiZXhwljoxNzYwNjQ2MTg4fQ.ZZaXHRfa57i4frCFIKLsRHU9Z7tI7JfU_o-TbEcwkN8
        '400':
          description: Solicitud inválida - Campos requeridos faltantes
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - message
                properties:
                  success:
                    type: boolean
                    example: false
                    description: Indica si la operación fue exitosa.
                  message:
                    type: string
                    example: Invalid credentials
                    description: Mensaje descriptivo del error.
                  errors:
                    type: object
                    nullable: true
                    description: Detalles específicos de los errores de validación.
                    properties:
                      short_name:
                        type: string
                        nullable: true
                        example: This field is required.
                        description: Error relacionado con el campo short_name.
                      password:
                        type: string
                        nullable: true
                        example: This field is required.
                        description: Error relacionado con el campo password.
                      authentication:
                        nullable: true
                        type: string
                        example: The provided credentials are incorrect
                        description: Error general de autenticación.
              example:
                success: false
                message: Missing required fields
                errors:
                  short_name: This field is required.
                  password: This field is required.
        '401':
          description: No autorizado - Credenciales incorrectas
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - message
                properties:
                  success:
                    type: boolean
                    example: false
                    description: Indica si la operación fue exitosa.
                  message:
                    type: string
                    example: Invalid credentials
                    description: Mensaje descriptivo del error.
                  errors:
                    type: object
                    nullable: true
                    description: Detalles específicos de los errores de validación.
                    properties:
                      short_name:
                        type: string
                        nullable: true
                        example: This field is required.
                        description: Error relacionado con el campo short_name.
                      password:
                        type: string
                        nullable: true
                        example: This field is required.
                        description: Error relacionado con el campo password.
                      authentication:
                        nullable: true
                        type: string
                        example: The provided credentials are incorrect
                        description: Error general de autenticación.
              example:
                success: false
                message: Invalid credentials
                errors:
                  authentication: The provided credentials are incorrect
        '422':
          description: Entidad no procesable - Datos de entrada inválidos
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - message
                properties:
                  success:
                    type: boolean
                    example: false
                    description: Indica si la operación fue exitosa.
                  message:
                    type: string
                    example: Invalid credentials
                    description: Mensaje descriptivo del error.
                  errors:
                    type: object
                    nullable: true
                    description: Detalles específicos de los errores de validación.
                    properties:
                      short_name:
                        type: string
                        nullable: true
                        example: This field is required.
                        description: Error relacionado con el campo short_name.
                      password:
                        type: string
                        nullable: true
                        example: This field is required.
                        description: Error relacionado con el campo password.
                      authentication:
                        nullable: true
                        type: string
                        example: The provided credentials are incorrect
                        description: Error general de autenticación.
              example:
                success: false
                message: Invalid input data
                errors:
                  short_name: Invalid format for short_name
                  password: Password must be at least 8 characters
        '429':
          description: Límite de intentos excedido
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - message
                properties:
                  success:
                    type: boolean
                    example: false
                    description: Indica si la operación fue exitosa.
                  message:
                    type: string
                    example: Invalid credentials
                    description: Mensaje descriptivo del error.
                  errors:
                    type: object
                    nullable: true
                    description: Detalles específicos de los errores de validación.
                    properties:
                      short_name:
                        type: string
                        nullable: true
                        example: This field is required.
                        description: Error relacionado con el campo short_name.
                      password:
                        type: string
                        nullable: true
                        example: This field is required.
                        description: Error relacionado con el campo password.
                      authentication:
                        nullable: true
                        type: string
                        example: The provided credentials are incorrect
                        description: Error general de autenticación.
              example:
                success: false
                message: Rate limit exceeded
                errors:
                  retry_after: '60'
        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - message
                properties:
                  success:
                    type: boolean
                    example: false
                    description: Indica si la operación fue exitosa.
                  message:
                    type: string
                    example: Invalid credentials
                    description: Mensaje descriptivo del error.
                  errors:
                    type: object
                    nullable: true
                    description: Detalles específicos de los errores de validación.
                    properties:
                      short_name:
                        type: string
                        nullable: true
                        example: This field is required.
                        description: Error relacionado con el campo short_name.
                      password:
                        type: string
                        nullable: true
                        example: This field is required.
                        description: Error relacionado con el campo password.
                      authentication:
                        nullable: true
                        type: string
                        example: The provided credentials are incorrect
                        description: Error general de autenticación.
              example:
                success: false
                message: Internal server error
  /api/v1/ext/agreements:
    post:
      summary: Crear Acuerdo de Pago
      description: >-
        Permite crear un nuevo **agreement de pago** que define las reglas de
        distribución y liquidación de las transacciones.


        ---


        ### ** Funcionalidades principales**


        * **Distribución de pagos (Split):** Define cómo se repartirán los
        fondos entre el comercio (owner) y sus partners o afiliados. El owner
        **siempre existe** y recibe automáticamente la diferencia no asignada a
        terceros.

        * **Liquidación bancaria inteligente:** Permite dirigir los pagos hacia
        distintas cuentas bancarias de destino dependiendo del banco de origen
        del pagador.

        * **Medios de pago configurables:** Determina qué tipos de pago acepta
        el acuerdo (`immediate_debit`, `crypto`, `mobile_payment`).

        * **`split`:**
         * **`false`:** No aplica distribución; el owner recibe el 100 % del pago.
         * **`true`:** Usa porcentajes predefinidos que se aplican de manera uniforme en todas las transacciones. Solo se definen las participaciones de los terceros receptores; la diferencia restante se asigna automáticamente al **owner**, quien siempre debe recibir una parte del pago.

        ### **Casos de uso típicos**


        * Comercios que trabajan con partners y necesitan distribuir comisiones
        automáticamente.

        * Marketplaces que deben dividir los pagos entre vendedores y la
        plataforma.

        * Servicios que liquidan fondos en distintas cuentas según el banco de
        origen.

        * Plataformas que requieren flexibilidad para definir la distribución
        por cada transacción.


        ### **Reutilización**


        Una vez creado, el *agreement* puede emplearse en múltiples sesiones de
        pago, asegurando **consistencia en la distribución**, **control sobre la
        liquidación bancaria**, y **trazabilidad completa** en todos los
        movimientos de fondos.
      operationId: createAgreement
      tags:
        - Endpoints Comunes
      security:
        - bearerAuth: []
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - title
                - payment_methods
                - default_bank_account_id
                - split
              properties:
                title:
                  type: string
                  nullable: false
                  description: Título visible.
                description:
                  type: string
                  nullable: true
                  description: >-
                    Descripción del acuerdo o del concepto de pago asociado a
                    una sesión.
                  maxLength: 500
                payment_methods:
                  type: object
                  required:
                    - immediate_debit
                    - crypto
                    - mobile_payment
                  properties:
                    immediate_debit:
                      type: boolean
                      description: Indica si permite pagos con débito inmediato.
                    crypto:
                      type: boolean
                      description: >-
                        Indica si se permiten pagos con criptomonedas en la
                        configuración correspondiente. La liquidación siempre
                        ocurre en bolívares.
                    mobile_payment:
                      type: boolean
                      description: Indica si permite pagos móviles.
                default_bank_account_id:
                  type: string
                  format: uuid
                  nullable: false
                  description: >-
                    UUID de la cuenta bancaria por defecto que se utilizará para
                    la liquidación.
                rules:
                  type: array
                  nullable: true
                  description: |-
                    (**En Desarrollo**) Reglas de acuerdo. 
                     En caso de usar origin_bank_code y destination_bank_account_id, se aplicará una regla de ruteo por banco de origen. Cada regla define a qué cuenta bancaria se debe enviar el dinero según el banco del pagador.
                  items:
                    type: object
                    properties:
                      origin_bank_code:
                        type: string
                        nullable: false
                        description: Código oficial del banco de origen.
                      destination_bank_account_id:
                        type: string
                        nullable: true
                        description: >-
                          UUID de la cuenta bancaria de destino para un banco de
                          origen específico.
                split:
                  type: boolean
                  description: >-
                    Modo de split: false (sin distribución) o true (permite
                    split por sesión).
            examples:
              Sin Split:
                summary: Acuerdo sin Split
                value:
                  title: Acuerdo sin Split
                  description: Sin distribución de fondos
                  split: false
                  payment_methods:
                    immediate_debit: true
                    crypto: false
                    mobile_payment: true
                  default_bank_account_id: uuid_sofitasa_001
                  rules:
                    - origin_bank_code: '0105'
                      destination_bank_account_id: uuid_mercantil_007
              Con Split:
                summary: Acuerdo con Split Flexible
                value:
                  title: Acuerdo Flexible
                  description: Split configurable por sesión de pago
                  split: true
                  payment_methods:
                    immediate_debit: true
                    crypto: false
                    mobile_payment: true
                  default_bank_account_id: uuid_sofitasa_001
                  rules:
                    - origin_bank_code: '0105'
                      destination_bank_account_id: uuid_mercantil_007
      responses:
        '200':
          description: Acuerdo creado exitosamente
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - data
                properties:
                  success:
                    type: boolean
                    nullable: false
                    description: >-
                      Indica si la operación fue exitosa. True si el endpoint se
                      procesó de forma exitosa. False de lo contrario
                    example: true
                  data:
                    type: object
                    required:
                      - agreement_id
                      - title
                      - split
                      - payment_methods
                      - default_bank_account_id
                      - status
                      - created_at
                      - created_by
                    properties:
                      agreement_id:
                        type: string
                        format: uuid
                        nullable: true
                        description: >-
                          Identificador único del acuerdo de liquidación. Debe
                          ser UUID v4.
                      title:
                        type: string
                        nullable: false
                        description: Título visible.
                      description:
                        type: string
                        nullable: true
                        description: >-
                          Descripción del acuerdo o del concepto de pago
                          asociado a una sesión.
                        maxLength: 500
                      split:
                        type: boolean
                        description: Modo de split configurado en el acuerdo.
                      payment_methods:
                        type: object
                        required:
                          - immediate_debit
                          - crypto
                          - mobile_payment
                        properties:
                          immediate_debit:
                            type: boolean
                            description: Indica si permite pagos con débito inmediato.
                          crypto:
                            type: boolean
                            description: >-
                              Indica si se permiten pagos con criptomonedas en
                              la configuración correspondiente. La liquidación
                              siempre ocurre en bolívares.
                          mobile_payment:
                            type: boolean
                            description: Indica si permite pagos móviles.
                      default_bank_account_id:
                        type: string
                        format: uuid
                        nullable: false
                        description: >-
                          UUID de la cuenta bancaria por defecto que se
                          utilizará para la liquidación.
                      rules:
                        type: array
                        nullable: true
                        description: |-
                          (**En Desarrollo**) Reglas de acuerdo. 
                           En caso de usar origin_bank_code y destination_bank_account_id, se aplicará una regla de ruteo por banco de origen. Cada regla define a qué cuenta bancaria se debe enviar el dinero según el banco del pagador.
                        items:
                          type: object
                          properties:
                            origin_bank_code:
                              type: string
                              nullable: false
                              description: Código oficial del banco de origen.
                            destination_bank_account_id:
                              type: string
                              nullable: true
                              description: >-
                                UUID de la cuenta bancaria de destino para un
                                banco de origen específico.
                      status:
                        type: string
                        nullable: false
                        enum:
                          - pending
                          - paid
                          - failed
                          - expired
                        description: >-
                          Estado actual de la sesión. El valor failed solo se
                          aplica para sesiones creadas con botón de pago.
                      created_at:
                        type: string
                        nullable: true
                        format: date-time
                        description: >-
                          Fecha y hora de creación del recurso en formato ISO
                          8601.
                      created_by:
                        type: string
                        nullable: true
                        description: >-
                          Identificador del usuario que creó el recurso
                          administrable.
              examples:
                Sin Split:
                  summary: 'Response - split: false'
                  value:
                    success: true
                    data:
                      agreement_id: agr_none_01
                      title: Acuerdo sin Split
                      type: button
                      description: >-
                        Sin distribución de fondos; el owner recibe el 100% de
                        los pagos
                      split: false
                      payment_methods:
                        immediate_debit: true
                        crypto: false
                        mobile_payment: true
                      default_bank_account_id: uuid_sofitasa_001
                      rules:
                        - origin_bank_code: '0105'
                          destination_bank_account_id: uuid_mercantil_007
                      status: active
                      created_at: '2024-01-15T10:30:00Z'
                      created_by: user_123
                Con Split:
                  summary: 'Response - split: true'
                  value:
                    success: true
                    data:
                      agreement_id: agr_by_session_01
                      title: Acuerdo Flexible
                      type: request
                      description: Split configurable por sesión de pago
                      split: true
                      payment_methods:
                        immediate_debit: true
                        crypto: false
                        mobile_payment: true
                      default_bank_account_id: uuid_sofitasa_001
                      rules:
                        - origin_bank_code: '0105'
                          destination_bank_account_id: uuid_mercantil_007
                      status: active
                      created_at: '2024-01-15T10:30:00Z'
                      created_by: user_123
        '400':
          description: Solicitud inválida - Campo faltante
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - message
                properties:
                  success:
                    type: boolean
                    example: false
                    description: Indica si la operación fue exitosa.
                  message:
                    type: string
                    example: 'Missing required field: title'
                    description: Mensaje descriptivo del error.
                  errors:
                    type: object
                    nullable: true
                    description: Detalles específicos de los errores de validación.
                    properties:
                      type:
                        type: string
                        example: Invalid value. Must be button or request
                        description: Error relacionado con el campo type.
                      split:
                        type: boolean
                        example: Invalid value. Must be true or false
                        description: Error relacionado con el modo de split.
                      spidi_id:
                        type: string
                        example: The credentials are incorrect
                        description: Error de autenticación.
                      field:
                        type: string
                        example: Invalid field value
                        description: Error genérico de campo.
              example:
                success: false
                message: 'Missing required field: title'
                errors:
                  title: This field is required.
        '401':
          description: No autorizado - Token inválido
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - message
                properties:
                  success:
                    type: boolean
                    example: false
                    description: Indica si la operación fue exitosa.
                  message:
                    type: string
                    example: 'Missing required field: title'
                    description: Mensaje descriptivo del error.
                  errors:
                    type: object
                    nullable: true
                    description: Detalles específicos de los errores de validación.
                    properties:
                      type:
                        type: string
                        example: Invalid value. Must be button or request
                        description: Error relacionado con el campo type.
                      split:
                        type: boolean
                        example: Invalid value. Must be true or false
                        description: Error relacionado con el modo de split.
                      spidi_id:
                        type: string
                        example: The credentials are incorrect
                        description: Error de autenticación.
                      field:
                        type: string
                        example: Invalid field value
                        description: Error genérico de campo.
              example:
                success: false
                message: Unauthorized.
                errors:
                  spidi_id: The credentials are incorrect
        '403':
          description: Prohibido - Sin permisos
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - message
                properties:
                  success:
                    type: boolean
                    example: false
                    description: Indica si la operación fue exitosa.
                  message:
                    type: string
                    example: 'Missing required field: title'
                    description: Mensaje descriptivo del error.
                  errors:
                    type: object
                    nullable: true
                    description: Detalles específicos de los errores de validación.
                    properties:
                      type:
                        type: string
                        example: Invalid value. Must be button or request
                        description: Error relacionado con el campo type.
                      split:
                        type: boolean
                        example: Invalid value. Must be true or false
                        description: Error relacionado con el modo de split.
                      spidi_id:
                        type: string
                        example: The credentials are incorrect
                        description: Error de autenticación.
                      field:
                        type: string
                        example: Invalid field value
                        description: Error genérico de campo.
              example:
                success: false
                message: Forbidden. You don't have permission for this operation.
        '409':
          description: Conflicto - Acuerdo duplicado
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - message
                properties:
                  success:
                    type: boolean
                    example: false
                    description: Indica si la operación fue exitosa.
                  message:
                    type: string
                    example: 'Missing required field: title'
                    description: Mensaje descriptivo del error.
                  errors:
                    type: object
                    nullable: true
                    description: Detalles específicos de los errores de validación.
                    properties:
                      type:
                        type: string
                        example: Invalid value. Must be button or request
                        description: Error relacionado con el campo type.
                      split:
                        type: boolean
                        example: Invalid value. Must be true or false
                        description: Error relacionado con el modo de split.
                      spidi_id:
                        type: string
                        example: The credentials are incorrect
                        description: Error de autenticación.
                      field:
                        type: string
                        example: Invalid field value
                        description: Error genérico de campo.
              example:
                success: false
                message: Duplicate agreement
        '422':
          description: Entidad no procesable - Datos inválidos
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - message
                properties:
                  success:
                    type: boolean
                    example: false
                    description: Indica si la operación fue exitosa.
                  message:
                    type: string
                    example: 'Missing required field: title'
                    description: Mensaje descriptivo del error.
                  errors:
                    type: object
                    nullable: true
                    description: Detalles específicos de los errores de validación.
                    properties:
                      type:
                        type: string
                        example: Invalid value. Must be button or request
                        description: Error relacionado con el campo type.
                      split:
                        type: boolean
                        example: Invalid value. Must be true or false
