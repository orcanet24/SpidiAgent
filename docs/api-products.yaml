  /api/v1/ext/payment-sessions/status/{session_id}:
    get:
      summary: Consultar Sesión
      description: >-
        Este endpoint permite consultar el estado actual de una sesión de pago y
        sus datos esenciales, generada mediante una solicitud de pago o botón de
        pago.


        Este endpoint es la fuente oficial y confiable para verificar si la
        sesión de pago fue completada con éxito (`paid`), rechazada (`failed`),
        expirada (`expired`) o está pendiente (`pending`).


        ### Origen de la Sesión


        Una sesión de pago puede crearse mediante un **Botón de pago** o una
        **Solicitud de pago**, cada una con su propio endpoint de creación. Sin
        embargo, para **consultar** una sesión de pago —sin importar cómo haya
        sido creada— se utiliza **el mismo endpoint** de consulta. En la
        respuesta, existe un campo `session_origin` que revelará si fue creada
        por botón de pago (`button`) o por solicitud (`request`).


        En los casos donde la sesión fue creada a través de un **Botón de
        pago**, el campo `status` puede tener un valor adicional: `failed`.


        ## Notas Importantes


        ### Verificación de Pagos (Backend Obligatorio)


        **No asumas `paid` solo por redirección**; **consulta este endpoint**
        desde tu servidor antes de liberar servicios o productos.


        ### Liquidación al Receptor


        Tras `paid`, la liquidación al receptor puede tardar unos segundos; en
        ese caso `receiver_credits` y `receiver_credits_summary` pueden venir
        `null` temporalmente. 


        **Independientemente de si la liquidación al receptor aún no ha
        ocurrido**, se considera en todo su concepto amplio que el pago fue
        realizado exitosamente, por lo que se debe continuar con la entrega del
        servicio o producto sin ningún problema.


        La liquidación al receptor es un proceso interno y, aunque puede demorar
        pocos segundos o hasta 2 minutos, no existe riesgo de fallo. En los
        términos y condiciones se especifica esta garantía, que constituye un
        derecho causado e irrevocable según los términos acordados.


        **Por lo tanto**: En caso de que tengas control, **no retengas ni
        retrases** la prestación del servicio al pagador mientras esperas la
        liquidación.


        ### Consulta de Datos de Liquidación


        Si necesitas mostrar o procesar datos de la liquidación, consulta el
        endpoint de status periódicamente hasta que los campos de
        `receiver_credits` estén presentes. 


        Opcionalmente, si implementaste un **webhook**, recibirás una
        notificación automática en tu API cuando la liquidación se haya
        completado y los datos estén disponibles (eventos `payment.paid` /
        `payment.settled`).


        ### URL del Comprobante


        Recuerda que se incluye el URL del comprobante exitoso
        (`spidi_transaction_url`), que debe ser mostrado al usuario de una forma
        u otra.


        ## Pagos con Criptomonedas


        - Si `payment_method` es `"crypto"`, el objeto `crypto_details`
        contendrá información específica del pago cripto

        - Si `payment_method` es distinto a `"crypto"`, entonces
        `crypto_details` será `null`

        - En caso de pago con crypto, si está en `"paid_pending"`, entonces los
        objetos `payment_details`, `receiver_credits` y
        `receiver_credits_summary` estarán presentes con valores `null`


        ## Split de Pagos


        - Si no se generó un split, entonces el objeto de `receiver_credits`
        tiene un solo elemento

        - Si existió el split, deben haber al menos dos elementos en
        `receiver_credits`


        ## Estados Vigentes


        - `pending`: Sesión creada, esperando que el usuario complete el pago

        - `paid`: Pago completado exitosamente

        - `expired`: Sesión expirada por inactividad o manualmente

        - `failed`: Pago fallido (solo para sesiones creadas con botón de pago)
      operationId: getPaymentSessionStatus
      tags:
        - Endpoints Botón
        - Endpoints Solicitud
      security:
        - bearerAuth: []
      parameters:
        - name: session_id
          in: path
          description: ID de la sesión de pago generada
          required: true
          schema:
            type: string
            format: uuid
            example: 3ddc4cfb-c09a-43de-92c1-e4a069732e90
      responses:
        '200':
          description: Consulta exitosa del estado de la sesión
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - message
                  - data
                properties:
                  success:
                    type: boolean
                    nullable: false
                    description: >-
                      Indica si la operación fue exitosa. True si el endpoint se
                      procesó de forma exitosa. False de lo contrario
                    example: true
                  message:
                    type: string
                    example: Successful query.
                    description: Mensaje de confirmación de la consulta.
                  data:
                    type: object
                    required:
                      - session_id
                      - session_origin
                      - agreement_id
                      - status
                      - currency_reference
                      - amount_reference
                      - identifier_label
                      - identifier
                      - description
                      - created_at
                      - session_payment
                    properties:
                      session_id:
                        type: string
                        nullable: false
                        description: >-
                          Identificador único de la sesión de pago, accedible a
                          través del payment_url.
                      session_origin:
                        type: string
                        nullable: false
                        enum:
                          - button
                          - request
                        description: >-
                          Origen de la sesión: 'button' (Botón de pago) o
                          'request' (Solicitud SPIDI).
                      agreement_id:
                        type: string
                        format: uuid
                        nullable: true
                        description: >-
                          Identificador único del acuerdo de liquidación. Debe
                          ser UUID v4.
                      status:
                        type: string
                        nullable: false
                        enum:
                          - pending
                          - paid
                          - failed
                          - expired
                        description: >-
                          Estado actual de la sesión. El valor failed solo se
                          aplica para sesiones creadas con botón de pago.
                      currency_reference:
                        type: string
                        nullable: false
                        enum:
                          - USD
                          - EUR
                          - COP
                          - USDT
                          - VES
                        description: >-
                          Moneda de referencia que se fija para el pago. Usada
                          para calcular el monto en bolívares con la tasa
                          vigente.
                      amount_reference:
                        description: >-
                          Monto de referencia en la moneda especificada en
                          currencyReference con 2 decimales.
                        type: number
                        nullable: false
                        format: double
                        example: '100.001'
                      identifier_label:
                        type: string
                        nullable: true
                        description: >-
                          Etiqueta que indica cómo debe interpretarse el valor
                          enviado en identifier (ej. 'Nro de orden').
                      identifier:
                        type: string
                        nullable: false
                        description: >-
                          Identificador del pagador, interpretado según el valor
                          de identifier_label. Ejemplo: Nro de orden, Nombre,
                          etc.
                      description:
                        type: string
                        nullable: true
                        description: >-
                          Descripción del acuerdo o del concepto de pago
                          asociado a una sesión.
                        maxLength: 500
                      created_at:
                        type: string
                        nullable: true
                        format: date-time
                        description: >-
                          Fecha y hora de creación del recurso en formato ISO
                          8601.
                      session_payment:
                        type: object
                        nullable: true
                        description: Detalles del pago y estado de la sesión.
                        properties:
                          payment_method:
                            type: string
                            description: >-
                              Método de pago: "crypto", "immediate_debit" o
                              "mobile_payment".
                          spidi_transaction_id:
                            type: integer
                            nullable: true
                            description: >-
                              ID de la transacción en Spidi (null si no se ha
                              completado).
                          spidi_transaction_url:
                            type: string
                            nullable: true
                            description: >-
                              URL del comprobante de pago (null si no se ha
                              completado).
                          due_date_session:
                            type: string
                            description: Fecha límite para completar el pago (ISO 8601).
                          due_date_reached_behavior:
                            type: string
                            description: >-
                              Comportamiento al expirar: "keep_active" o
                              "expire".
                          late_notice_message:
                            type: string
                            description: Mensaje para mostrar cuando el pago está atrasado.
                          expired_at:
                            type: string
                            description: Fecha hora ISO 8601 de la expiración más reciente.
                          last_expired_by:
                            type: string
                            nullable: true
                            enum:
                              - api
                              - system
                            description: 'Origen de la expiración: api o system.'
                          reason:
                            type: string
                            nullable: true
                            enum:
                              - api
                              - system
                            description: 'Origen de la expiración: api o system.'
                          user_message:
                            type: string
                            description: Último Mensaje para el usuario.
                          crypto_details:
                            type: object
                            nullable: true
                            description: >-
                              Detalles de pago con criptomonedas (null si no
                              aplica).
                            properties:
                              provider_name:
                                type: string
                                nullable: true
                                description: >-
                                  Nombre de la entidad o plataforma financiera
                                  que custodia los activos del usuario.
                                  Representa el ecosistema o 'banco digital'
                                  donde reside el saldo original (ej. Binance,
                                  Crixto).
                                examples:
                                  - Binance
                                  - Crixto
                              crypto_order_id:
                                type: string
                                nullable: true
                                description: >-
                                  Identificador de la orden cripto generada por
                                  el proveedor.
                              payment_method_name:
                                type: string
                                description: >-
                                  Nombre del método de pago (ej. Binance Pay,
                                  Crixto Pay).
                                examples:
                                  - Binance Pay
                                  - Crixto Pay
                              amount_transaction_ves:
                                type: number
                                format: double
                                nullable: true
                                description: >-
                                  Monto con 3 decimales de la transacción en la
                                  moneda VES. Note que es el monto original sin
                                  incluir la comisión por el pago.
                                example: 157.783
                              amount_pay_by_user_crypto:
                                type: number
                                format: double
                                nullable: true
                                description: >-
                                  Monto con 3 decimales del pago realizado por
                                  el usuario en la moneda cripto. Note que puede
                                  variar del monto original si se aplica una
                                  comisión por el pago.
                                example: 157.783
                              currency_crypto:
                                type: string
                                nullable: true
                                description: >-
                                  Moneda cripto utilizada en el pago (por
                                  ejemplo, USDT).
                                enum:
                                  - USDT
                              exchange_rate:
                                type: number
                                format: double
                                description: >-
                                  Tasa Cripto/Fiat usada durante la conversión
                                  de cripto-fiat, especificada 4 decimales
                                example: 157.7837
                              paid_at:
                                type: string
                                nullable: true
                                format: date-time
                                description: >-
                                  Fecha y hora en que se confirmó el pago
                                  cripto, en formato ISO 8601.
                          payment_details:
                            type: object
                            nullable: true
                            description: Detalles del pago bancario (null si no aplica).
                            properties:
                              action_date:
                                type: string
                                format: date-time
                                nullable: true
                                description: >-
                                  Fecha y hora de la acción del pagador, en
                                  formato ISO 8601 con sufijo Z (UTC).
                              bank_name:
                                type: string
                                nullable: true
                                description: >-
                                  Nombre comercial del banco. Eco del request:
                                  no.
                              bank_reference_id:
                                type: string
                                nullable: true
                                description: >-
                                  Referencia bancaria del pago. Eco del request:
                                  no.
                              amount_ves:
                                type: number
                                description: Monto en bolívares con 2 decimales.
                                format: double
                              bcv_rate_usd_ves:
                                type: number
                                nullable: true
                                format: decimal(10,4)
                                description: >-
