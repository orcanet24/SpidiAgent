         Se produce cuando ocurre un fallo en el intento de acreditar los fondos a un receptor esperado del pago. Se enviará una notificación de este evento mediante un webhook por cada intento fallido. El sistema realizará reintentos automáticos hasta lograr la acreditación exitosa.
      parameters:
        - name: spidi-signature
          in: header
          required: true
          description: >-
            Firma HMAC-SHA256 para validar la autenticidad e integridad del
            mensaje.
          schema:
            type: string
            example: d9c8227652758252615617f6a8759526703902939d892376987f22387a672889
        - name: spidi-timestamp
          in: header
          required: true
          description: >-
            Timestamp ISO 8601 de la creación del evento para prevenir ataques
            de replay.
          schema:
            type: string
            format: date-time
            example: '2026-02-06T15:24:36.000Z'
        - name: idempotency-key
          in: header
          required: true
          description: >-
            UUID v4 único para garantizar que la operación se procese una sola
            vez.
          schema:
            type: string
            format: uuid
            example: 93465a7e-ea9b-41a8-8dca-14e811641c25
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - event
                - data
              properties:
                event:
                  type: string
                  enum:
                    - payment_session.accreditation_to_recipient_failed
                  description: >-
                    Se enviará cuando ocurre un fallo en el intento de acreditar
                    los fondos a un receptor esperado del pago.
                data:
                  type: object
                  required:
                    - session_payment
                    - credit
                  properties:
                    session_payment:
                      type: object
                      properties:
                        id:
                          type: string
                          nullable: false
                          description: >-
                            Identificador único de la sesión de pago, accedible
                            a través del payment_url.
                        origin:
                          type: string
                          nullable: false
                          enum:
                            - button
                            - request
                          description: >-
                            Origen de la sesión: 'button' (Botón de pago) o
                            'request' (Solicitud SPIDI).
                        agreement_id:
                          type: string
                          format: uuid
                          nullable: true
                          description: >-
                            Identificador único del acuerdo de liquidación. Debe
                            ser UUID v4.
                        currency_reference:
                          type: string
                          nullable: false
                          enum:
                            - USD
                            - EUR
                            - COP
                            - USDT
                            - VES
                          description: >-
                            Moneda de referencia que se fija para el pago. Usada
                            para calcular el monto en bolívares con la tasa
                            vigente.
                        amount_reference:
                          description: >-
                            Monto de referencia en la moneda especificada en
                            currencyReference con 2 decimales.
                          type: number
                          nullable: false
                          format: double
                          example: '100.001'
                        identifier_label:
                          type: string
                          nullable: true
                          description: >-
                            Etiqueta que indica cómo debe interpretarse el valor
                            enviado en identifier (ej. 'Nro de orden').
                        identifier:
                          type: string
                          nullable: false
                          description: >-
                            Identificador del pagador, interpretado según el
                            valor de identifier_label. Ejemplo: Nro de orden,
                            Nombre, etc.
                        description:
                          type: string
                          nullable: true
                          description: >-
                            Descripción del acuerdo o del concepto de pago
                            asociado a una sesión.
